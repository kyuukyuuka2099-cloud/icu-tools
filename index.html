function newsCol(k, v, p) { // スコア表のどの列に該当するか（0〜6）
  if (!L.isN(v)) return -1;
  const m = {
    rr: x => x <= 8 ? 0 : x <= 11 ? 2 : x <= 20 ? 3 : x <= 24 ? 5 : 6,
    spo2s1: x => x <= 91 ? 0 : x <= 93 ? 1 : x <= 95 ? 2 : 3,
    spo2s2: x => x <= 83 ? 0 : x <= 85 ? 1 : x <= 87 ? 2 : x <= 92 || !p.o2 ? 3 : x <= 94 ? 4 : x <= 96 ? 5 : 6,
    sbp: x => x <= 90 ? 0 : x <= 100 ? 1 : x <= 110 ? 2 : x <= 219 ? 3 : 6,
    hr: x => x <= 40 ? 0 : x <= 50 ? 2 : x <= 90 ? 3 : x <= 110 ? 4 : x <= 130 ? 5 : 6,
    temp: x => x <= 35 ? 0 : x <= 36 ? 2 : x <= 38 ? 3 : x <= 39 ? 4 : 5
  };
  return m[k](v);
}

function computeNEWS() {
  validate($('#p-news'));
  const p = { rr: val('w_rr'), spo2: val('w_spo2'), scale: +ST.w_scale, o2: ST.w_o2 === 1, sbp: val('w_sbp'), hr: val('w_hr'), acvpu: ST.w_acvpu, temp: val('w_temp') };
  const o = L.news2(p);
  // 表のハイライト
  $$('#w_tbl td').forEach(c => c.classList.remove('hlx', 'hl'));
  const mark = (r, col) => { if (col < 0) return; const tr = $(`#w_tbl tr[data-r="${r}"]`); if (tr) tr.children[col + 1].classList.add('hlx'); };
  mark('rr', newsCol('rr', p.rr, p)); mark('sbp', newsCol('sbp', p.sbp, p)); mark('hr', newsCol('hr', p.hr, p)); mark('temp', newsCol('temp', p.temp, p));
  mark(p.scale === 2 ? 'spo2s2' : 'spo2s1', newsCol(p.scale === 2 ? 'spo2s2' : 'spo2s1', p.spo2, p));
  $(`#w_tbl tr[data-r="${p.scale === 2 ? 'spo2s1' : 'spo2s2'}"]`).style.opacity = .35;
  $(`#w_tbl tr[data-r="${p.scale === 2 ? 'spo2s2' : 'spo2s1'}"]`).style.opacity = 1;
  mark('o2', p.o2 ? 1 : 3); mark('acvpu', p.acvpu === 'A' ? 3 : 6);
  const R = {
    low: { lv: 'ok', t: '低リスク', d: '観察頻度：最低12時間ごと（0点）、4〜6時間ごと（1〜4点）。担当看護師が評価を継続。' },
    lowmed: { lv: 'warn', t: '低〜中リスク（単一項目3点）', d: '観察頻度：最低1時間ごと。担当看護師が速やかに医師へ報告し、評価を依頼。' },
    medium: { lv: 'warn', t: '中リスク', d: '観察頻度：最低1時間ごと。緊急の医師評価（急変対応の閾値）。RRT要請を検討。' },
    high: { lv: 'danger', t: '高リスク', d: '持続モニタリング。救急対応（RRT・集中治療チーム）を直ちに要請。' }
  }[o.risk];
  const entered = 7 - o.missing.length;
  const lbl = { rr: '呼吸数', spo2: 'SpO₂', o2: '酸素投与', sbp: '収縮期血圧', hr: '脈拍', acvpu: '意識', temp: '体温' };
  const q = L.qsofa(p.rr, p.sbp, p.acvpu && p.acvpu !== 'A');
  const parts = Object.keys(lbl).map(k => { const v = o.parts[k]; const c = v == null ? 'var(--ink3)' : v === 3 ? 'var(--danger)' : v === 2 ? 'var(--warn)' : v === 1 ? 'var(--info)' : 'var(--ok)'; return `<div style="display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid var(--line);font-size:13.5px"><span>${lbl[k]}</span><b class="num" style="color:${c}">${v == null ? '—' : v}</b></div>`; }).join('');
  const noVit = ['rr', 'spo2', 'sbp', 'hr', 'temp'].every(k => o.missing.includes(k));
  $('#w_out').innerHTML = noVit ? CARD('NEWS2 結果', '<div class="hero"><div class="val" style="font-size:20px;color:var(--ink3)">バイタルサインを入力</div><div class="desc">入力と同時に点数・リスク・観察頻度を表示します。</div></div>', { right: help('news2') }) : CARD('NEWS2 結果', `<div class="hero ${R.lv}"><div class="lbl">NEWS2 合計　<span class="tiny">入力 ${entered}/7 項目</span></div><div class="val">${o.total}<span style="font-size:16px"> 点</span></div><div class="desc"><b>${R.t}</b><br>${R.d}</div></div>
    ${o.missing.length && o.missing.length < 7 ? `<div class="alert warn">未入力：${o.missing.map(k => lbl[k]).join('・')}（合計は過小評価になります）</div>` : ''}
    ${o.red3 ? '<div class="alert danger">単一項目で3点があります。合計点が低くても速やかに評価を。</div>' : ''}
    ${p.scale === 2 && p.o2 && L.isN(p.spo2) && p.spo2 >= 93 ? '<div class="alert warn">スケール2で酸素投与中にSpO₂ 93%以上：過剰な酸素投与の可能性（CO₂ナルコーシスに注意）。</div>' : ''}
    ${parts}<div class="tiny" style="margin-top:8px">院内のRRT起動基準がある場合はそちらを優先してください。</div>`, { right: help('news2') });

}

  <div class="homegrid">${list.map(p => `<button class="hcard" data-go="${p.id}"><div class="ic">${svgI(p.icon)}</div><h3>${p.title}</h3><p>${p.sub}</p></button>`).join('')}<a class="hcard" href="simulator.html" style="text-decoration:none;color:inherit"><div class="ic">${svgI('sim')}</div><h3>急変対応シミュレーター Pro ↗</h3><p>急変シナリオの実践トレーニング（同じフォルダの simulator.html を開きます）</p></a></div>
  <div class="cols" style="margin-top:20px"><div>${CARD('ご使用にあたって', `<ul class="ref" style="padding-left:18px;margin:0;font-size:13px"><li>本ツールは評価・判断の<b>補助</b>です。診断・治療方針は医師の判断と施設の基準・マニュアルを優先してください。</li><li>酸素デバイスのFiO₂は当院の酸素療法デバイス確認表・ブレンダー流量計早見表に準拠しています。</li><li>数値の異常値は入力欄が赤くなります（入力ミスの防止）。</li><li>推奨環境：Microsoft Edge／Google Chrome／Safari の最新版（iPhone・iPad対応）。</li></ul>`)}</div>
  <div>${CARD('Version 2.0 の主な変更点', `<ul class="ref" style="padding-left:18px;margin:0;font-size:13px"><li><b>NIHSS</b>：責任病変判定を全面的に作り直し。左右を「患者の左／右」で明示し、左麻痺では右半球と正しく判定。顔面・視野・共同偏視・失調・感覚・無視の側性、交叉性麻痺（脳幹）、小脳、血管領域（MCA/ACA/PCA/ラクナ）、LVO疑い、所見の矛盾チェックを追加</li><li><b>血液ガス</b>：Δ比、補正AG、H-H式による入力整合性チェック、酸素解離曲線</li><li><b>循環</b>：CI・SVR・CPO・DO₂、ショックの型、Forrester、CS、Nohria-Stevenson</li><li><b>栄養</b>：目標を何割に設定するか（スライダー・プリセット）、漸増スケジュール、達成率、Refeedingリスク、IN/OUT</li><li><b>NEWS2</b>：早期警告スコア（スコア表ハイライト・観察頻度・qSOFA同時表示）を新設</li><li><b>SOFA</b>：敗血症／敗血症性ショック判定、γ計算</li><li><b>トリアージ</b>：ランダム症例とタグ切り取り練習</li><li>デザインを一新（ダークモード・スマートフォン対応・印刷対応）</li></ul>`)}</div></div>
  ${CARD('主な参考文献', `<ol class="ref" style="padding-left:18px;margin:0"><li>日本版敗血症診療ガイドライン2024（J-SSCG 2024）／Singer M, et al. Sepsis-3. JAMA 2016</li><li>Royal College of Physicians. National Early Warning Score (NEWS) 2. 2017</li><li>Vincent JL, et al. The SOFA score. Intensive Care Med 1996／Ranzani OT, et al. SOFA-2. JAMA 2025</li><li>日本循環器学会/日本心不全学会. 急性・慢性心不全診療ガイドライン（2017年改訂版）、2021年フォーカスアップデート版</li><li>日本脳卒中学会. 脳卒中治療ガイドライン2021［改訂2023］／静注血栓溶解（rt-PA）療法 適正治療指針 第三版</li><li>Brott T, et al. NIH Stroke Scale. Stroke 1989</li><li>Singer P, et al. ESPEN guideline on clinical nutrition in the ICU. Clin Nutr 2019／日本集中治療医学会. 日本版重症患者の栄養療法ガイドライン 2016</li><li>NICE CG32. Nutrition support for adults（Refeeding）</li><li>ARDS Definition Task Force. Berlin Definition. JAMA 2012</li><li>日本DMAT／MCLS 標準テキスト（START法）</li></ol>`)}`;
}, function () { });

/* =========================================================
   初期化・イベント
   ========================================================= */
function buildAll() {
  const order = ['home', 'news', 'abg', 'hemo', 'nihss', 'nutri', 'sepsis', 'triage'];
  PAGES.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  $('#nav-list').innerHTML = PAGES.map(p => `<li><button data-go="${p.id}">${svgI(p.icon)}<span>${p.title}</span></button></li>`).join('') +
    `<li style="margin-top:10px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px"><button onclick="location.href='simulator.html'">${svgI('sim')}<span>急変対応シミュレーター ↗</span></button></li>`;
  $('#pages').innerHTML = PAGES.map(p => `<section class="page" id="p-${p.id}"></section>`).join('');
  PAGES.forEach(p => { $('#p-' + p.id).innerHTML = p.build(); });
  abgDevOpts();
  PAGES.forEach(p => p.compute());
  trNext();
}
function rebuild(id) {
  const P = PAGES.find(p => p.id === id); const sec = $('#p-' + id);
  $$('[data-segname]', sec).forEach(s => delete ST[s.dataset.segname]);
  $$('[data-seg]', sec).forEach(b => delete ST[b.dataset.seg]);
  sec.innerHTML = P.build();
  if (id === 'abg') abgDevOpts();
  P.compute();
}
function curPage() { const s = $('.page.on'); return s ? s.id.slice(2) : 'home'; }
function computeFor(el) { const sec = el.closest('.page'); if (!sec) return; const P = PAGES.find(p => 'p-' + p.id === sec.id); if (P) P.compute(); }

document.addEventListener('click', e => {
  const t = e.target;
  const g = t.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const h = t.closest('[data-help]'); if (h) { showHelp(h.dataset.help); return; }
  if (t.closest('#mdl-x') || t.id === 'mdl') { $('#mdl').classList.remove('on'); return; }
  const sb = t.closest('[data-seg]');
  if (sb) {
    const n = sb.dataset.seg, raw = sb.dataset.v;
    ST[n] = raw !== '' && !isNaN(+raw) ? +raw : raw;
    $$(`[data-seg="${n}"]`).forEach(b => b.classList.toggle('on', b === sb));
    if (n === 'g_dev') abgDevOpts();
    computeFor(sb); return;
  }
  const pm = t.closest('[data-pm]');
  if (pm) { const el = document.getElementById(pm.dataset.pm); let v = el.value.trim(); v = v.startsWith('-') ? v.slice(1) : '-' + v; el.value = v; el.focus(); computeFor(el); return; }
  const rs = t.closest('[data-reset]'); if (rs) { rebuild(rs.dataset.reset); return; }
  const tb = t.closest('[data-tab]');
  if (tb) { const grp = tb.parentElement; $$('[data-tab]', grp).forEach(b => b.classList.toggle('on', b === tb)); $$('[data-tab]', grp).forEach(b => { const s = document.getElementById(b.dataset.tab); if (s) s.classList.toggle('on', b === tb); }); return; }
  if (t.id === 'n_coma') { ST.n1a = 3; Object.assign(ST, L.nihssComaDefaults); syncSeg('#p-nihss'); computeNIHSS(); return; }
  if (t.id === 'n_zero') { L.nihssItems.forEach(k => ST[k] = 0); syncSeg('#p-nihss'); computeNIHSS(); return; }
  const pc = t.closest('[data-pct]'); if (pc) { $('#u_pct').value = pc.dataset.pct; computeNutri(); return; }
  if (t.id === 'u_rf10' || t.id === 'u_rf5') {
    const o = L.nutri({ sex: $('#u_sex').value, age: val('u_age'), ht: val('u_ht'), wt: val('u_wt'), basis: $('#u_basis').value, method: ST.u_meth, kcalPerKg: +$('#u_kpk').value, af: +$('#u_af').value, sf: +$('#u_sf').value, targetPct: 100, proteinPerKg: 1 });
    if (!L.isN(o.fullKcal)) { alertBox('身長・体重（H-B式では年齢も）を先に入力してください。'); return; }
    const k = t.id === 'u_rf10' ? 10 : 5;
    $('#u_pct').value = Math.max(5, Math.round(k * o.dw / o.fullKcal * 100)); computeNutri(); return;
  }
  if (t.id === 'd_apply') {
    const g = L.dose(val('d_mg'), val('d_ml'), val('d_rate'), val('d_wt'));
    setv('s_' + $('#d_drug').value, +g.toFixed(3)); computeSepsis(); return;
  }
  const st = t.closest('[data-strip]'); if (st && !TR.judged) { TR.keep = +st.dataset.strip; trRenderTag(); return; }
  const ct = t.closest('[data-cat]'); if (ct && !TR.judged) { TR.cat = TR.cat === ct.dataset.cat ? null : ct.dataset.cat; trRenderTag(); return; }
  if (t.id === 'tr_judge') { trJudge(); return; }
  if (t.id === 'tr_next') { trNext(); return; }
  if (t.id === 'tr_undo') { if (!TR.judged) { TR.keep = 3; trRenderTag(); } return; }
  if (t.id === 'tt_now') { const d = new Date(); setv('tt_time', `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`); return; }
  if (t.closest('#menu-btn')) { $('.nav').classList.toggle('open'); return; }
  if (t.closest('#theme-btn')) { toggleTheme(); return; }
});
function alertBox(msg) { $('#mdl-t').textContent = 'お知らせ'; $('#mdl-b').innerHTML = `<p>${esc(msg)}</p>`; $('#mdl').classList.add('on'); }
function syncSeg(scope) { $$('[data-seg]', $(scope)).forEach(b => b.classList.toggle('on', ST[b.dataset.seg] !== undefined && String(ST[b.dataset.seg]) === b.dataset.v)); }
document.addEventListener('input', e => { if (e.target.matches('input,select')) computeFor(e.target); });
document.addEventListener('change', e => { if (e.target.type === 'checkbox') e.target.dataset.touched = '1'; if (e.target.matches('input,select')) computeFor(e.target); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#mdl').classList.remove('on'); });
setInterval(() => { if (TR.c && !TR.judged && $('#tr_time')) $('#tr_time').textContent = Math.floor((Date.now() - TR.t0) / 1000); }, 500);

function toggleTheme() {
  const d = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = d; try { localStorage.setItem('icu-theme', d); } catch (e) { }
}
(function init() {
  try { const t = localStorage.getItem('icu-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { }
  buildAll();
  const h = (location.hash || '').slice(1);
  go(PAGES.some(p => p.id === h) ? h : 'home');
})();
</script>
</body>
</html>
