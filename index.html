<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>救急・ICU 臨床支援ツール v2.0</title>
<style>:root{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#f8fafc; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
  --line:#e2e8f0; --line2:#cbd5e1; --brand:#0e7490; --brand2:#0891b2; --brand-soft:#e0f2fe;
  --nav:#0b1f33; --nav2:#12304d; --nav-ink:#cbd5e1;
  --ok:#15803d; --ok-bg:#dcfce7; --info:#1d4ed8; --info-bg:#dbeafe; --warn:#b45309; --warn-bg:#fef3c7; --danger:#b91c1c; --danger-bg:#fee2e2;
  --r:12px; --sh:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0b1220; --panel:#111a2b; --panel2:#0f1726; --ink:#e5e7eb; --ink2:#a5b4c8; --ink3:#64748b;
  --line:#1f2b40; --line2:#2b3a55; --brand:#22b8cf; --brand2:#38c9de; --brand-soft:#0f2a3a;
  --nav:#070d18; --nav2:#0f1a2c; --ok:#4ade80; --ok-bg:#0f2e1c; --info:#7aa2ff; --info-bg:#14234a; --warn:#fbbf24; --warn-bg:#33270b; --danger:#f87171; --danger-bg:#3a1414;
  --sh:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.num,input[type=number],.big{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.nav{background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand b{display:block;color:#fff;font-size:16px;letter-spacing:.02em}
.brand small{color:#7f93ab;font-size:11.5px}
.nav ul{list-style:none;margin:8px 0;padding:0 10px}
.nav li button{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;background:none;border-radius:9px;color:var(--nav-ink);cursor:pointer;text-align:left;font-size:14px}
.nav li button:hover{background:var(--nav2);color:#fff}
.nav li button.on{background:linear-gradient(90deg,#0e7490,#0b5f77);color:#fff;box-shadow:inset 3px 0 0 #67e8f9}
.nav svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .foot{margin-top:auto;padding:14px 18px;font-size:11.5px;color:#6b7f98;border-top:1px solid rgba(255,255,255,.07)}
.nav .foot button{background:var(--nav2);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;margin-bottom:8px}
main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:14px}
.topbar h1{font-size:19px;margin:0;font-weight:700}
.topbar .sub{color:var(--ink2);font-size:13px}
.topbar .sp{flex:1}
.menu-btn{display:none}
.page{display:none;padding:22px 28px 60px;max-width:1400px}
.page.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.9fr);gap:20px;align-items:start}
.sticky{position:sticky;top:74px}
/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px}
.card>header{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.card>header h2{font-size:15px;margin:0;font-weight:700}
.card>header .tag{font-size:11.5px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
.card>header .sp{flex:1}
.card .bd{padding:16px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 14px}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fld label{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink2);margin-bottom:4px;font-weight:600}
.fld .in{display:flex;align-items:stretch;border:1px solid var(--line2);border-radius:9px;background:var(--panel);overflow:hidden;transition:border-color .12s,box-shadow .12s}
.fld .in:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.fld input,.fld select{border:0;outline:0;background:transparent;padding:8px 10px;width:100%;min-width:0;font-size:15px}
.fld .u{display:flex;align-items:center;padding:0 9px;color:var(--ink3);font-size:12px;background:var(--panel2);border-left:1px solid var(--line);white-space:nowrap}
.fld.bad .in{border-color:var(--danger);background:var(--danger-bg)}
.fld .hint{font-size:11.5px;color:var(--ink3);margin-top:3px}
select{appearance:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:7px 13px;cursor:pointer;font-size:13.5px;font-weight:600}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2);color:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.help{width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--ink2);font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:1}
.help:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
/* segmented */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:13.5px;text-align:left;line-height:1.35;transition:border-color .1s}
.seg button b{font-variant-numeric:tabular-nums;margin-right:6px;display:inline-block;min-width:1.1em;text-align:center}
.seg button:hover{border-color:var(--brand)}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 1px 4px color-mix(in srgb,var(--brand) 40%,transparent)}
.seg.side button.on{background:#7c3aed;border-color:#7c3aed}
.seg.col{flex-direction:column}
.seg.col button{width:100%}
.chk{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--panel);font-size:14px;line-height:1.45}
.chk:hover{border-color:var(--brand)}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--brand);flex:none}
.chk.on{background:var(--brand-soft);border-color:var(--brand)}
.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
/* results */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);position:relative}
.kpi .k{font-size:11.5px;color:var(--ink2);font-weight:600;display:flex;gap:4px;align-items:center}
.kpi .v{font-size:23px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .v small{font-size:12px;color:var(--ink3);font-weight:500;margin-left:3px}
.kpi .n{font-size:11px;color:var(--ink3)}
.kpi.ok{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:var(--ok-bg)} .kpi.ok .v{color:var(--ok)}
.kpi.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-bg)} .kpi.warn .v{color:var(--warn)}
.kpi.danger{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));background:var(--danger-bg)} .kpi.danger .v{color:var(--danger)}
.kpi.info .v{color:var(--info)}
.kpi.empty .v{color:var(--ink3)}
.hero{border-radius:12px;padding:16px 18px;margin-bottom:14px;border:1px solid var(--line);background:var(--panel2)}
.hero .lbl{font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:.04em}
.hero .val{font-size:30px;font-weight:800;line-height:1.2;margin:2px 0}
.hero .desc{font-size:13.5px;color:var(--ink2)}
.hero.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 35%,transparent)} .hero.ok .val{color:var(--ok)}
.hero.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 30%,transparent)} .hero.info .val{color:var(--info)}
.hero.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)} .hero.warn .val{color:var(--warn)}
.hero.danger{background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 35%,transparent)} .hero.danger .val{color:var(--danger)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;line-height:1.5}
.steps li .k{font-weight:700;font-size:12px;color:var(--ink2)}
.steps li.ok{border-left:4px solid var(--ok)} .steps li.info{border-left:4px solid var(--info)} .steps li.warn{border-left:4px solid var(--warn);background:var(--warn-bg)} .steps li.danger{border-left:4px solid var(--danger);background:var(--danger-bg)}
.alert{border-radius:10px;padding:10px 12px;font-size:13.5px;margin:8px 0;border:1px solid;display:flex;gap:9px;line-height:1.5}
.alert::before{content:"!";flex:none;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;margin-top:1px}
.alert.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)} .alert.warn::before{background:var(--warn)}
.alert.danger{background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 35%,transparent)} .alert.danger::before{background:var(--danger)}
.alert.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 30%,transparent)} .alert.info::before{background:var(--info);content:"i"}
.alert.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 30%,transparent)} .alert.ok::before{background:var(--ok);content:"✓"}
.muted{color:var(--ink2);font-size:13px}
.tiny{font-size:11.5px;color:var(--ink3)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--line2);background:var(--panel2)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.pill.danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}.pill.info{background:var(--info-bg);color:var(--info);border-color:transparent}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
table.t th{background:var(--panel2);font-size:12px;color:var(--ink2);font-weight:700}
table.t td.hl,table.t th.hl{background:var(--brand-soft);color:var(--brand);font-weight:800}
table.t td.hlx{background:var(--brand);color:#fff;font-weight:800;border-radius:4px}
table.t tr td:first-child,table.t tr th:first-child{text-align:left}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:700;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px;font-size:14px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.sub{display:none}.sub.on{display:block}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
hr.s{border:0;border-top:1px solid var(--line);margin:14px 0}
.ref{font-size:12px;color:var(--ink2);line-height:1.6}
.ref li{margin-bottom:3px}
/* NIHSS */
.ni{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.ni:last-child{border-bottom:0}
.ni .h{font-weight:700;font-size:14px}
.ni .h small{display:block;color:var(--ink3);font-weight:500;font-size:11.5px}
.ni .sidebox{margin-top:8px;padding:8px 10px;border-radius:9px;background:color-mix(in srgb,#7c3aed 7%,var(--panel));border:1px dashed color-mix(in srgb,#7c3aed 40%,var(--line));display:none}
.ni .sidebox.on{display:block}
.ni .sidebox .q{font-size:12px;font-weight:700;color:#7c3aed;margin-bottom:5px}
.limb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.limb{border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.limb .lh{font-weight:800;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.limb.L .lh{color:#c2410c}.limb.R .lh{color:#1d4ed8}
.sidechip{display:inline-block;padding:0 7px;border-radius:5px;font-size:11.5px;color:#fff}
.sidechip.L{background:#c2410c}.sidechip.R{background:#1d4ed8}
.brainwrap{display:flex;gap:12px;align-items:center}
.brainwrap svg{flex:none}
.reason{font-size:13px;padding:6px 9px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);margin-bottom:5px;display:flex;gap:8px}
.reason .s{flex:none;font-weight:800;font-size:11px;padding:1px 6px;border-radius:5px;color:#fff;background:var(--ink3);height:fit-content}
.reason .s.R{background:#1d4ed8}.reason .s.L{background:#c2410c}.reason .s.BS,.reason .s.CB,.reason .s.B{background:#7c3aed}
/* triage */
.tri-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.case{font-size:16px;line-height:1.8}
.case .vit{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.case .vit span{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:14px}
.ttag{width:300px;border-radius:10px 10px 6px 6px;background:#fffdf5;color:#1f2937;border:1px solid #d6cfb6;box-shadow:0 6px 24px rgba(0,0,0,.12);overflow:hidden;font-size:12px;position:relative}
.ttag .hole{width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid #b9b29a;margin:8px auto 2px}
.ttag .ttl{text-align:center;font-weight:800;font-size:17px;letter-spacing:.3em;padding:2px 0 6px;border-bottom:2px solid #1f2937}
.ttag .fx{display:grid;grid-template-columns:76px 1fr;border-bottom:1px solid #d6cfb6}
.ttag .fx div{padding:4px 6px}.ttag .fx div:first-child{background:#f3eedb;font-weight:700;border-right:1px solid #d6cfb6}
.ttag .fx input{width:100%;border:0;background:transparent;font-size:12px;outline:0;color:#111}
.ttag .cats{display:flex;justify-content:space-around;padding:6px;font-weight:800;font-size:13px;border-bottom:2px solid #1f2937;background:#f3eedb}
.ttag .cats span{padding:0 6px;border-radius:4px}.ttag .cats span.on{outline:2px solid #111}
.strip{height:44px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;letter-spacing:.2em;cursor:pointer;border-top:2px dashed rgba(0,0,0,.35);transition:transform .35s ease,opacity .35s ease,height .35s ease;position:relative;user-select:none}
.strip:hover{filter:brightness(1.08)}
.strip.black{background:#111;color:#fff}.strip.red{background:#dc2626;color:#fff}.strip.yellow{background:#facc15;color:#111}.strip.green{background:#16a34a;color:#fff}
.strip.torn{height:0;opacity:0;transform:translateY(30px) rotate(-6deg);border:0;overflow:hidden}
.strip .ins{position:absolute;right:8px;font-size:10px;letter-spacing:0;font-weight:600;opacity:.75}
.flow{display:flex;flex-direction:column;gap:6px}
.flow .fs{display:flex;gap:8px;align-items:center;font-size:13.5px}
.flow .fs .q{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.flow .fs .a{font-weight:700;white-space:nowrap}
.flow .fs.end .q{border-width:2px}
.colorchip{display:inline-block;padding:2px 10px;border-radius:6px;font-weight:800}
.colorchip.black{background:#111;color:#fff}.colorchip.red{background:#dc2626;color:#fff}.colorchip.yellow{background:#facc15;color:#111}.colorchip.green{background:#16a34a;color:#fff}
.scorebar{display:flex;gap:14px;font-size:13px;color:var(--ink2)}
.scorebar b{font-size:20px;color:var(--ink)}
/* home */
.homegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;box-shadow:var(--sh);transition:transform .12s,border-color .12s;text-align:left}
.hcard:hover{transform:translateY(-2px);border-color:var(--brand)}
.hcard .ic{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.hcard .ic svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hcard h3{margin:0 0 4px;font-size:16px}
.hcard p{margin:0;color:var(--ink2);font-size:13px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border-radius:14px;max-width:620px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .box header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.modal .box header h3{margin:0;font-size:16px;flex:1}
.modal .box .bd{padding:16px 18px;font-size:14px;line-height:1.75}
.modal .box .bd p{margin:0 0 10px}
.range{display:flex;align-items:center;gap:12px}
.range input[type=range]{flex:1;accent-color:var(--brand);height:28px}
.range .rv{font-size:26px;font-weight:800;min-width:76px;text-align:right;color:var(--brand)}
.preset{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .2s}
.bar.over i{background:var(--warn)}
.bar .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
@media (max-width:1100px){.cols{grid-template-columns:1fr}.sticky{position:static}.tri-wrap{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .nav{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .2s}
  .nav.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .menu-btn{display:inline-flex}
  .page{padding:16px 14px 50px}.topbar{padding:10px 14px}
  .ni{grid-template-columns:1fr}
  .grid.g3{grid-template-columns:1fr 1fr}
  .steps li{grid-template-columns:1fr}
}
@media print{
  .nav,.topbar,.btn,.help,.tabs{display:none!important}
  .app{display:block}.page{display:none!important}.page.on{display:block!important;padding:0}
  .cols{grid-template-columns:1fr 1fr}.card{box-shadow:none;break-inside:avoid}
  body{background:#fff}
}

.fld .pm{border:0;border-right:1px solid var(--line);background:var(--panel2);color:var(--brand);font-weight:800;font-size:17px;padding:0 12px;cursor:pointer;min-width:42px}
.fld .pm:active{background:var(--brand);color:#fff}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.tw table.t{min-width:520px}
.fld .errmsg{font-size:11.5px;color:var(--danger);margin-top:3px;font-weight:600}
.cols>div,.tri-wrap>div{min-width:0}
@media (max-width:820px){.ttag{width:100%;max-width:320px}.ttag+.tiny{width:auto!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="ツール一覧">

<script>/* ==========================================================
   臨床計算ロジック（純粋関数）  ― UIから独立させ自動テスト可能にしている
   ========================================================== */
(function (root) {
  'use strict';
  var L = {};
  var isN = function (v) { return typeof v === 'number' && isFinite(v); };
  L.isN = isN;
  L.r = function (v, d) { if (!isN(v)) return null; var m = Math.pow(10, d || 0); return Math.round(v * m) / m; };

  /* ---------------- 酸素デバイス（当院早見表） ---------------- */
  L.O2 = {
    nasal: { 1: 24, 2: 28, 3: 32, 4: 36 },
    oxymask: { 5: 40, 6: 47, 7: 50, 8: 53, 9: 57, 10: 62 },
    reservoir: { 8: 70, 10: 80 },
    blenderDials: [28, 33, 35, 40, 60, 80, 98],
    blenderRows: {
      3: [14, 13, 13, 12, 7, 5, 4],
      4: [20, 19, 17, 15, 9, 6, 4],
      5: [28, 25, 24, 21, 12, 8, 6],
      6: [35, 32, 30, 24, 14, 9, 7],
      7: [42, 40, 37, 31, 17, 11, 8],
      8: [48, 47, 42, 36, 19, 12, 10],
      9: [53, 54, 49, 39, 22, 14, 11],
      10: [57, 61, 57, 45, 24, 15, 13]
    },
    notes: {
      nasal: '流量4L以下は加湿不要。ただし患者に自覚症状（鼻腔乾燥など）があれば4L以下でも加湿を開始する。',
      oxymask: '使用前にディフューザーの破損がないか確認する。5L以上で加湿器を使用する。',
      reservoir: '使用前にリザーバーバッグが膨らんでいることを確認し、使用中もバッグがしぼまないことを確認する。5L以上で加湿器を使用する。'
    }
  };

  /** device: room|nasal|oxymask|reservoir|blender|manual  戻り値 {fio2(0-1), text, note, blenderValue} */
  L.fio2 = function (device, flow, dial, manualPct) {
    var O = L.O2, pct = null, text = '', note = '', bv = null;
    if (device === 'room') { pct = 21; text = '室内気'; }
    else if (device === 'nasal' || device === 'oxymask' || device === 'reservoir') {
      pct = O[device][flow] != null ? O[device][flow] : null;
      text = { nasal: '鼻カニューラ', oxymask: 'オキシマスク', reservoir: 'リザーバーマスク' }[device] + (flow ? ' ' + flow + 'L/分' : '');
      note = O.notes[device];
    } else if (device === 'blender') {
      var di = O.blenderDials.indexOf(+dial);
      if (di >= 0) pct = +dial;
      if (di >= 0 && O.blenderRows[flow]) bv = O.blenderRows[flow][di];
      text = 'ブレンダー流量計 ダイヤル' + (dial ? dial + '%' : '');
    } else if (device === 'manual') {
      if (isN(manualPct) && manualPct >= 21 && manualPct <= 100) pct = manualPct;
      text = 'FiO₂直接入力';
    }
    return { fio2: pct == null ? null : pct / 100, pct: pct, text: text, note: note, blenderValue: bv };
  };

  /* ---------------- 血液ガス ---------------- */
  L.severinghaus = function (po2) { // SO2(%)
    if (!isN(po2) || po2 <= 0) return null;
    return 100 / (23400 / (Math.pow(po2, 3) + 150 * po2) + 1);
  };

  /**
   * p: {ph,pco2,hco3,po2,fio2(0-1),spo2,na,cl,alb,lac,age,patm,respChronic:'acute'|'chronic'|''}
   */
  L.abg = function (p) {
    var o = { steps: [], flags: [], primary: null, disorders: [] };
    var ph = p.ph, c = p.pco2, h = p.hco3;
    // 0) 整合性チェック（Henderson-Hasselbalch）
    if (isN(ph) && isN(c) && isN(h)) {
      var hCalc = 0.0307 * c * Math.pow(10, ph - 6.1);
      o.hCalc = hCalc;
      if (Math.abs(hCalc - h) > 3) o.flags.push({ lv: 'warn', t: '入力値の整合性に注意：pH・PaCO₂から計算したHCO₃⁻は ' + hCalc.toFixed(1) + ' mEq/L（入力 ' + h + '）。転記ミスや静脈血混入の可能性を確認してください。' });
    }
    // 1) pH
    if (isN(ph)) {
      o.phState = ph < 7.35 ? 'acidemia' : ph > 7.45 ? 'alkalemia' : 'normal';
      o.steps.push({ k: 'pH', t: ph < 7.35 ? 'アシデミア（pH ' + ph + ' < 7.35）' : ph > 7.45 ? 'アルカレミア（pH ' + ph + ' > 7.45）' : 'pHは基準範囲（7.35〜7.45）', lv: ph < 7.2 || ph > 7.6 ? 'danger' : (ph < 7.35 || ph > 7.45) ? 'warn' : 'ok' });
    }
    // 2) 一次性障害
    if (isN(ph) && isN(c) && isN(h)) {
      var rA = c > 45, rK = c < 35, mA = h < 22, mK = h > 26, prim = null;
      if (ph < 7.35) {
        if (rA && mA) { prim = 'mixed-acid'; }
        else if (rA) prim = 'resp-acid';
        else if (mA) prim = 'met-acid';
      } else if (ph > 7.45) {
        if (rK && mK) prim = 'mixed-alk';
        else if (rK) prim = 'resp-alk';
        else if (mK) prim = 'met-alk';
      } else {
        if (rA && mK) prim = ph < 7.40 ? 'resp-acid' : 'met-alk';
        else if (rK && mA) prim = ph < 7.40 ? 'met-acid' : 'resp-alk';
        else if (rA && !mK) prim = 'resp-acid';
        else if (rK && !mA) prim = 'resp-alk';
        else if (mA) prim = 'met-acid';
        else if (mK) prim = 'met-alk';
      }
      o.primary = prim;
      var name = {
        'resp-acid': '呼吸性アシドーシス', 'resp-alk': '呼吸性アルカローシス', 'met-acid': '代謝性アシドーシス', 'met-alk': '代謝性アルカローシス',
        'mixed-acid': '呼吸性＋代謝性アシドーシス（混合性）', 'mixed-alk': '呼吸性＋代謝性アルカローシス（混合性）'
      };
      if (prim) { o.disorders.push(name[prim]); o.steps.push({ k: '一次性障害', t: name[prim] + (ph >= 7.35 && ph <= 7.45 ? '（pHは代償により基準範囲内）' : ''), lv: 'info' }); }
      else o.steps.push({ k: '一次性障害', t: 'PaCO₂・HCO₃⁻ともに明らかな一次性異常なし（AGは別途確認）', lv: 'ok' });

      // 3) 代償の評価
      var comp = null;
      if (prim === 'met-acid') {
        var e = 1.5 * h + 8;
        comp = '予測PaCO₂（Winterの式 1.5×HCO₃⁻+8±2）= ' + (e - 2).toFixed(1) + '〜' + (e + 2).toFixed(1) + ' mmHg';
        if (c > e + 2) { comp += ' → 実測が高い：呼吸性アシドーシスの合併（換気不全）'; o.disorders.push('呼吸性アシドーシスの合併'); }
        else if (c < e - 2) { comp += ' → 実測が低い：呼吸性アルカローシスの合併'; o.disorders.push('呼吸性アルカローシスの合併'); }
        else comp += ' → 適切な呼吸性代償';
      } else if (prim === 'met-alk') {
        var e2 = 0.7 * h + 21;
        comp = '予測PaCO₂（0.7×HCO₃⁻+21±2）= ' + (e2 - 2).toFixed(1) + '〜' + (e2 + 2).toFixed(1) + ' mmHg';
        if (c > e2 + 2) { comp += ' → 実測が高い：呼吸性アシドーシスの合併'; o.disorders.push('呼吸性アシドーシスの合併'); }
        else if (c < e2 - 2) { comp += ' → 実測が低い：呼吸性アルカローシスの合併'; o.disorders.push('呼吸性アルカローシスの合併'); }
        else comp += ' → 適切な呼吸性代償';
      } else if (prim === 'resp-acid') {
        var d = c - 40, ea = 24 + 0.1 * d, ec = 24 + 0.35 * d;
        comp = '予測HCO₃⁻：急性 ' + ea.toFixed(1) + '（+1/10mmHg）／慢性 ' + ec.toFixed(1) + '（+3.5/10mmHg）mEq/L';
        if (h < ea - 2) { comp += ' → 急性の予測より低い：代謝性アシドーシスの合併'; o.disorders.push('代謝性アシドーシスの合併'); }
        else if (h > ec + 2) { comp += ' → 慢性の予測より高い：代謝性アルカローシスの合併'; o.disorders.push('代謝性アルカローシスの合併'); }
        else if (h <= ea + 2) comp += ' → 急性呼吸性アシドーシスに合致';
        else if (h >= ec - 2) comp += ' → 慢性（代償された）呼吸性アシドーシスに合致';
        else comp += ' → 急性と慢性の中間（慢性の急性増悪など）';
      } else if (prim === 'resp-alk') {
        var d2 = 40 - c, ea2 = 24 - 0.2 * d2, ec2 = 24 - 0.4 * d2;
        comp = '予測HCO₃⁻：急性 ' + ea2.toFixed(1) + '（−2/10mmHg）／慢性 ' + ec2.toFixed(1) + '（−4/10mmHg）mEq/L';
        if (h > ea2 + 2) { comp += ' → 急性の予測より高い：代謝性アルカローシスの合併'; o.disorders.push('代謝性アルカローシスの合併'); }
        else if (h < ec2 - 2) { comp += ' → 慢性の予測より低い：代謝性アシドーシスの合併'; o.disorders.push('代謝性アシドーシスの合併'); }
        else if (h >= ea2 - 2) comp += ' → 急性呼吸性アルカローシスに合致';
        else if (h <= ec2 + 2) comp += ' → 慢性（代償された）呼吸性アルカローシスに合致';
        else comp += ' → 急性と慢性の中間';
      } else if (prim && prim.indexOf('mixed') === 0) {
        comp = '呼吸性・代謝性の両方が同方向に異常 → 代償ではなく混合性障害';
      }
      if (comp) o.steps.push({ k: '代償の評価', t: comp, lv: o.disorders.length > 1 ? 'warn' : 'info' });
    }
    // 4) アニオンギャップ
    if (isN(p.na) && isN(p.cl) && isN(h)) {
      var ag = p.na - p.cl - h, cag = ag;
      o.ag = ag;
      if (isN(p.alb)) { cag = ag + 2.5 * (4.0 - p.alb); o.cag = cag; }
      var agv = isN(p.alb) ? cag : ag;
      var agt = 'AG = ' + ag.toFixed(1) + (isN(p.alb) ? '／Alb補正AG = ' + cag.toFixed(1) : '（Alb未入力：低Alb時は過小評価に注意）') + ' mEq/L（基準 12±2）';
      var agHigh = agv > 14;
      var mi = o.disorders.indexOf('代謝性アシドーシス');
      if (agHigh) {
        agt += ' → AG開大';
        if (mi >= 0) o.disorders[mi] = 'AG開大性代謝性アシドーシス';
        else if (o.disorders.join().indexOf('AG開大') < 0) o.disorders.push('AG開大性代謝性アシドーシス' + (h >= 22 ? '（HCO₃⁻正常域でも潜在）' : ''));
      } else if (h < 22) {
        agt += ' → AG正常（高Cl性）代謝性アシドーシス';
        if (mi >= 0) o.disorders[mi] = 'AG正常（高Cl性）代謝性アシドーシス';
      }
      o.steps.push({ k: 'アニオンギャップ', t: agt, lv: agHigh ? 'warn' : 'info' });
      // 5) Δ比
      if (agHigh && h < 24) {
        var dr = (agv - 12) / (24 - h); o.deltaRatio = dr;
        var dt = 'Δ比 =（AG−12）/（24−HCO₃⁻）= ' + dr.toFixed(2);
        if (dr < 0.4) { dt += ' → AG正常（高Cl性）代謝性アシドーシスの合併'; o.disorders.push('AG正常代謝性アシドーシスの合併'); }
        else if (dr < 1) { dt += ' → AG開大＋AG正常アシドーシスの混在の可能性'; o.disorders.push('AG正常代謝性アシドーシスの合併の可能性'); }
        else if (dr <= 2) dt += ' → 純粋なAG開大性代謝性アシドーシス';
        else { dt += ' → 代謝性アルカローシスの合併（または慢性呼吸性アシドーシスによるHCO₃⁻上昇）'; o.disorders.push('代謝性アルカローシスの合併'); }
        o.steps.push({ k: 'Δ比', t: dt, lv: dr < 1 || dr > 2 ? 'warn' : 'info' });
      } else if (agHigh && h >= 24) {
        o.steps.push({ k: 'Δ比', t: 'HCO₃⁻が24以上なのにAG開大 → 代謝性アルカローシスとAG開大性アシドーシスの合併を疑う', lv: 'warn' });
        o.disorders.push('代謝性アルカローシス＋AG開大性アシドーシスの合併');
      }
    }
    // 6) 乳酸
    if (isN(p.lac)) {
      o.steps.push({ k: '乳酸', t: 'Lac ' + p.lac + ' mmol/L' + (p.lac >= 4 ? ' → 著明高値（組織低灌流・ショックを強く疑う）' : p.lac > 2 ? ' → 高値（敗血症性ショック基準 >2）' : ' → 基準範囲'), lv: p.lac >= 4 ? 'danger' : p.lac > 2 ? 'warn' : 'ok' });
    }
    // 7) 酸素化
    var f = p.fio2;
    if (isN(p.po2) && isN(f) && f > 0) {
      var pf = p.po2 / f; o.pf = pf;
      var pft = 'P/F比 = ' + pf.toFixed(0);
      if (pf <= 100) pft += '（≦100：重度の酸素化障害）'; else if (pf <= 200) pft += '（≦200：中等度）'; else if (pf <= 300) pft += '（≦300：軽度）'; else pft += '（>300）';
      o.steps.push({ k: '酸素化', t: pft, lv: pf <= 100 ? 'danger' : pf <= 300 ? 'warn' : 'ok' });
      if (isN(c)) {
        var patm = isN(p.patm) ? p.patm : 760;
        var PAO2 = f * (patm - 47) - c / 0.8; o.PAO2 = PAO2; o.aado2 = PAO2 - p.po2;
        var norm = isN(p.age) ? p.age / 4 + 4 : null; o.aaNorm = norm;
        var at = 'A-aDO₂ = ' + o.aado2.toFixed(1) + ' mmHg（PAO₂ ' + PAO2.toFixed(1) + '）';
        if (f > 0.215) at += '　※酸素投与下では基準値が大きく上昇するため経時比較に用いる';
        else if (norm != null) at += '　年齢補正の目安 ≦' + norm.toFixed(0) + (o.aado2 > norm ? ' → 開大（V/Q不均等・シャント・拡散障害）' : ' → 正常範囲（低酸素なら肺胞低換気を考える）');
        o.steps.push({ k: 'A-aDO₂', t: at, lv: (f <= 0.215 && norm != null && o.aado2 > norm) ? 'warn' : 'info' });
      }
    }
    if (isN(p.spo2) && isN(f) && f > 0) {
      o.sf = p.spo2 / f;
      o.steps.push({ k: 'S/F比', t: 'S/F比 = ' + o.sf.toFixed(0) + (p.spo2 > 97 ? '（SpO₂>97%ではS/F比の信頼性が低下）' : ''), lv: 'info' });
    }
    return o;
  };

  /* ---------------- 循環 ---------------- */
  L.bsa = function (ht, wt) { return isN(ht) && isN(wt) && ht > 0 && wt > 0 ? 0.007184 * Math.pow(wt, 0.425) * Math.pow(ht, 0.725) : null; };
  L.hemo = function (p) {
    var o = {};
    o.bsa = L.bsa(p.ht, p.wt);
    o.map = isN(p.map) ? p.map : (isN(p.sbp) && isN(p.dbp) ? (p.sbp + 2 * p.dbp) / 3 : null);
    o.mapCalculated = !isN(p.map);
    if (isN(p.hr) && isN(p.sbp) && p.sbp > 0) o.si = p.hr / p.sbp;
    if (isN(p.hr) && isN(o.map) && o.map > 0) o.msi = p.hr / o.map;
    if (isN(p.sbp) && isN(p.dbp)) { o.pp = p.sbp - p.dbp; o.ppp = o.pp / p.sbp * 100; }
    if (isN(p.co)) {
      if (o.bsa) o.ci = p.co / o.bsa;
      if (isN(p.hr) && p.hr > 0) { o.sv = p.co * 1000 / p.hr; if (o.bsa) o.svi = o.sv / o.bsa; }
      if (isN(o.map) && isN(p.cvp) && p.co > 0) { o.svr = (o.map - p.cvp) * 80 / p.co; if (o.bsa) o.svri = o.svr * o.bsa; }
      if (isN(o.map)) o.cpo = o.map * p.co / 451;
      if (isN(p.hb) && isN(p.sao2)) {
        var cao2 = 1.34 * p.hb * p.sao2 / 100 + 0.003 * (isN(p.pao2) ? p.pao2 : 0);
        o.cao2 = cao2; o.do2 = p.co * cao2 * 10; if (o.bsa) o.do2i = o.do2 / o.bsa;
      }
    }
    if (isN(p.uo) && isN(p.wt) && p.wt > 0) o.uokg = p.uo / p.wt;
    // ショックの型（CI・SVRがあるとき）
    if (isN(o.ci) && isN(o.svr)) {
      var lowCI = o.ci < 2.2, highSVR = o.svr > 1200, lowSVR = o.svr < 800;
      var cvpHigh = isN(p.cvp) ? p.cvp >= 12 : null, pawpHigh = isN(p.pawp) ? p.pawp >= 18 : null;
      if (!lowCI && lowSVR) o.shockType = { k: 'distributive', t: '血液分布異常性ショックのパターン（CI保たれ・SVR低下）：敗血症、アナフィラキシー、神経原性など' };
      else if (lowCI && highSVR) {
        if (cvpHigh === false && pawpHigh !== true) o.shockType = { k: 'hypovolemic', t: '循環血液量減少性ショックのパターン（CI低下・SVR上昇・CVP低値）：出血、脱水など' };
        else if (pawpHigh === true) o.shockType = { k: 'cardiogenic', t: '心原性ショックのパターン（CI低下・SVR上昇・PAWP上昇）：ACS、心筋症、不整脈など' };
        else if (cvpHigh === true) o.shockType = { k: 'obstructive-or-cardiogenic', t: 'CI低下・SVR上昇・CVP上昇：心原性（右心不全含む）または閉塞性（心タンポナーデ、緊張性気胸、肺塞栓）。エコーで鑑別' };
        else o.shockType = { k: 'lowflow', t: '低心拍出＋血管収縮のパターン。CVP/PAWP・エコーで前負荷を評価して鑑別' };
      } else if (lowCI) o.shockType = { k: 'lowflow', t: 'CI低下（SVRは正常域）：前負荷・心収縮力の評価を' };
    }
    // Forrester
    if (isN(o.ci) && isN(p.pawp)) {
      var hi = p.pawp > 18, lo = o.ci < 2.2;
      o.forrester = !lo && !hi ? 'I' : !lo && hi ? 'II' : lo && !hi ? 'III' : 'IV';
    }
    // Clinical Scenario（急性心不全）
    if (isN(p.sbp)) o.cs = p.sbp > 140 ? 1 : p.sbp >= 100 ? 2 : 3;
    return o;
  };
  /** Nohria-Stevenson  wet:うっ血所見数, cold:低灌流所見数 */
  L.nohria = function (wet, cold) {
    var W = wet > 0, C = cold > 0;
    if (!W && !C) return { p: 'A', t: 'Warm & Dry（プロファイルA）', d: 'うっ血・低灌流所見なし。' };
    if (W && !C) return { p: 'B', t: 'Warm & Wet（プロファイルB）', d: 'うっ血あり・灌流保持。利尿薬・血管拡張薬が中心。' };
    if (W && C) return { p: 'C', t: 'Cold & Wet（プロファイルC）', d: 'うっ血＋低灌流。強心薬・血管収縮薬、機械的補助の検討。最も予後不良。' };
    return { p: 'L', t: 'Cold & Dry（プロファイルL）', d: '低灌流のみ。前負荷不足の評価（輸液負荷の検討）、強心薬。' };
  };

  /* ---------------- NIHSS ---------------- */
  L.nihssItems = ['n1a', 'n1b', 'n1c', 'n2', 'n3', 'n4', 'n5L', 'n5R', 'n6L', 'n6R', 'n7', 'n8', 'n9', 'n10', 'n11'];
  L.nihssTotal = function (s) {
    var t = 0, missing = [];
    L.nihssItems.forEach(function (k) { var v = s[k]; if (v === 'UN') return; if (isN(v)) t += v; else missing.push(k); });
    return { total: t, missing: missing };
  };
  L.nihssSeverity = function (t) {

  <div class="sticky" id="g_out"></div></div>`;
}, computeABG);

function abgDevOpts() {
  const d = ST.g_dev, box = $('#g_devopts');

  else if (d === 'oxymask') h = SEL('g_flow', '酸素流量', [['', '選択'], 5, 6, 7, 8, 9, 10].map(x => Array.isArray(x) ? x : [String(x), x + ' L/分']));
  else if (d === 'reservoir') h = SEL('g_flow', '酸素流量', [['', '選択'], 8, 10].map(x => Array.isArray(x) ? x : [String(x), x + ' L/分']));
  else if (d === 'blender') h = `<div class="grid g2">${SEL('g_dial', 'ダイヤル目盛り', [['', '選択']].concat(L.O2.blenderDials.map(x => [String(x), x + '%'])))}${SEL('g_flow', 'トータルフロー（早見表の行）', [['', '選択']].concat(Object.keys(L.O2.blenderRows).map(x => [x, x + ' L/min'])))}</div>`;
  else if (d === 'manual') h = `<div class="grid g2">${F('g_fio2m', 'FiO₂', '%', { min: 21, max: 100, ph: '40' })}</div>`;

  if (prev.m != null && $('#g_fio2m')) $('#g_fio2m').value = prev.m;
}

function odcSVG(po2, so2) {
  const W = 340, H = 190, px = x => 34 + x / 150 * (W - 46), py = y => H - 26 - y / 100 * (H - 40);
  let d = ''; for (let x = 1; x <= 150; x += 1) { d += (x === 1 ? 'M' : 'L') + px(x).toFixed(1) + ' ' + py(L.severinghaus(x)).toFixed(1); }
  let pt = '';
  if (L.isN(po2)) {
    const pred = L.severinghaus(Math.min(po2, 150));
    pt += `<line x1="${px(Math.min(po2, 150))}" y1="${py(0)}" x2="${px(Math.min(po2, 150))}" y2="${py(pred)}" stroke="var(--brand)" stroke-dasharray="3 3"/><circle cx="${px(Math.min(po2, 150))}" cy="${py(pred)}" r="5" fill="var(--brand)"/>`;
    if (L.isN(so2)) pt += `<circle cx="${px(Math.min(po2, 150))}" cy="${py(so2)}" r="5" fill="none" stroke="var(--danger)" stroke-width="2"/>`;
  }
  const grid = [0, 30, 60, 90, 120, 150].map(x => `<line x1="${px(x)}" y1="${py(0)}" x2="${px(x)}" y2="${py(100)}" stroke="var(--line)"/><text x="${px(x)}" y="${H - 10}" font-size="10" text-anchor="middle" fill="var(--ink3)">${x}</text>`).join('') +
    [0, 50, 90, 100].map(y => `<line x1="${px(0)}" y1="${py(y)}" x2="${px(150)}" y2="${py(y)}" stroke="var(--line)"/><text x="28" y="${py(y) + 3}" font-size="10" text-anchor="end" fill="var(--ink3)">${y}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="酸素解離曲線">${grid}<rect x="${px(0)}" y="${py(90)}" width="${px(60) - px(0)}" height="${py(0) - py(90)}" fill="var(--danger)" opacity=".06"/><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2"/>${pt}<text x="${px(150)}" y="${H - 1}" font-size="10" text-anchor="end" fill="var(--ink3)">PaO₂ (mmHg)</text><text x="4" y="12" font-size="10" fill="var(--ink3)">SaO₂ %</text></svg>`;
}

function computeABG() {
  validate($('#p-abg'));
  const d = ST.g_dev;
  const fo = L.fio2(d, val('g_flow'), val('g_dial'), val('g_fio2m'));
  // ブレンダー表ハイライト
  $$('#bl-table td, #bl-table th').forEach(c => c.classList.remove('hl', 'hlx'));
  if (d === 'blender') {
    const dial = val('g_dial'), fl = val('g_flow');
    if (dial != null) $$(`#bl-table [data-dial="${dial}"]`).forEach(c => c.classList.add('hl'));
    if (fl != null) $$(`#bl-table tr[data-flow="${fl}"] td`).forEach(c => c.classList.add('hl'));
    if (dial != null && fl != null) { const c = $(`#bl-table tr[data-flow="${fl}"] td[data-dial="${dial}"]`); if (c) c.classList.add('hlx'); }
  }
  let note = '';
  if (fo.note) note += `<div class="alert info">${fo.note}</div>`;
  if (d === 'blender' && fo.blenderValue != null) note += `<div class="alert ok">早見表の値：<b>${fo.blenderValue}</b>（ダイヤル ${val('g_dial')}% × ${val('g_flow')} L/min）　FiO₂は <b>${fo.pct}%</b> として計算します。</div>`;
  if (d === 'manual') note += `<div class="alert info">ネーザルハイフロー・NPPV・人工呼吸器など、設定FiO₂が明確なデバイスで使用します。</div>`;
  $('#g_devnote').innerHTML = note;

  const p = { ph: val('g_ph'), pco2: val('g_pco2'), hco3: val('g_hco3'), po2: val('g_po2'), fio2: fo.fio2, spo2: val('g_spo2'), na: val('g_na'), cl: val('g_cl'), alb: val('g_alb'), lac: val('g_lac'), age: val('g_age'), patm: val('g_patm') };
  const o = L.abg(p);
  const has = [p.ph, p.pco2, p.hco3].every(L.isN);
  let hero;
  if (!has) hero = `<div class="hero"><div class="lbl">判定</div><div class="val" style="font-size:20px;color:var(--ink3)">pH・PaCO₂・HCO₃⁻を入力</div><div class="desc">入力と同時に段階的に解釈します。</div></div>`;
  else {
    const lv = o.disorders.length > 1 || (p.ph < 7.2 || p.ph > 7.6) ? 'danger' : o.disorders.length ? 'warn' : 'ok';
    hero = `<div class="hero ${lv}"><div class="lbl">酸塩基平衡の判定</div><div class="val" style="font-size:22px">${o.disorders.length ? esc(o.disorders[0]) : '明らかな酸塩基障害なし'}</div>${o.disorders.length > 1 ? `<div class="desc">＋ ${o.disorders.slice(1).map(esc).join('<br>＋ ')}</div>` : ''}</div>`;
  }
  const pfLv = o.pf == null ? '' : o.pf <= 100 ? 'danger' : o.pf <= 300 ? 'warn' : 'ok';
  const kp = `<div class="kpis">
    ${KPI('FiO₂', fo.pct != null ? fo.pct : '—', '%', 'info', fo.text)}
    ${KPI('P/F比', fx(o.pf), '', pfLv, '', 'pf')}
    ${KPI('A-aDO₂', fx(o.aado2, 1), 'mmHg', '', o.aaNorm != null && p.fio2 <= 0.215 ? '目安≦' + o.aaNorm.toFixed(0) : '', 'aado2')}
    ${KPI(o.cag != null ? '補正AG' : 'AG', fx(o.cag != null ? o.cag : o.ag, 1), '', o.ag == null ? '' : (o.cag != null ? o.cag : o.ag) > 14 ? 'warn' : 'ok', o.cag != null ? 'AG ' + fx(o.ag, 1) : '', 'ag')}
    ${KPI('Δ比', fx(o.deltaRatio, 2), '', o.deltaRatio == null ? '' : (o.deltaRatio < 1 || o.deltaRatio > 2) ? 'warn' : 'ok', '', 'delta')}
    ${KPI('計算HCO₃⁻', fx(o.hCalc, 1), '', '', 'H-H式')}
    ${KPI('S/F比', fx(o.sf), '', '', '')}
    ${KPI('乳酸', p.lac != null ? p.lac : '—', 'mmol/L', p.lac == null ? '' : p.lac >= 4 ? 'danger' : p.lac > 2 ? 'warn' : 'ok')}
  </div>`;
  const flags = o.flags.map(f => `<div class="alert ${f.lv}">${esc(f.t)}</div>`).join('');
  const k = val('g_k'), glu = val('g_glu');
  let extra = '';
  if (k != null && (k >= 6 || k < 3)) extra += `<div class="alert ${k >= 6.5 || k < 2.5 ? 'danger' : 'warn'}">K⁺ ${k} mEq/L：${k >= 6 ? '高K血症（心電図変化を確認）' : '低K血症（不整脈に注意）'}</div>`;
  if (glu != null && (glu < 70 || glu >= 250)) extra += `<div class="alert ${glu < 70 ? 'danger' : 'warn'}">血糖 ${glu} mg/dL：${glu < 70 ? '低血糖' : '高血糖（DKA/HHSならAG・ケトンを確認）'}</div>`;
  const steps = o.steps.length ? `<ul class="steps">${o.steps.map(s => `<li class="${s.lv}"><span class="k">${s.k}</span><span>${esc(s.t)}</span></li>`).join('')}</ul>` : '<div class="muted">入力待ち</div>';
  $('#g_out').innerHTML = CARD('評価結果', hero + flags + kp + extra, { right: help('winters') }) +
    CARD('段階的解釈', steps, { tag: 'Step 1〜7' }) +
    CARD('酸素解離曲線', odcSVG(p.po2, p.spo2) + `<div class="tiny">● PaO₂から予測されるSaO₂（標準条件）　◯ 入力したSpO₂/SaO₂${L.isN(p.po2) ? `　｜ 予測SaO₂ ${fx(L.severinghaus(p.po2), 1)}%` : ''}</div>`, { right: help('odc') });
}

});

page('hemo', '循環評価', 'バイタル・血行動態パラメータ・Nohria-Stevenson分類・ショックの型', 'hemo', function () {
  const wet = [['w1', '起座呼吸'], ['w2', '頸静脈圧の上昇（頸静脈怒張）'], ['w3', '浮腫'], ['w4', '腹水'], ['w5', '肝頸静脈逆流']];
  const cold = [['c1', '小さい脈圧（比例脈圧 <25%）<span class="tiny" id="ppp_auto"></span>'], ['c2', '四肢冷感'], ['c3', '傾眠・意識レベル低下'], ['c4', '低Na血症'], ['c5', '腎機能悪化（尿量減少）']];
  return `<div class="cols"><div>
  ${CARD('バイタルサイン', `<div class="grid">
    ${F('h_hr', '心拍数', '回/分', { min: 20, max: 250 })}${F('h_sbp', '収縮期血圧', 'mmHg', { min: 30, max: 300 })}${F('h_dbp', '拡張期血圧', 'mmHg', { min: 10, max: 200 })}
    ${F('h_map', 'MAP（実測）', 'mmHg', { min: 20, max: 250, hint: '空欄なら計算値' })}${F('h_ht', '身長', 'cm', { min: 50, max: 230 })}${F('h_wt', '体重', 'kg', { min: 2, max: 300 })}
    ${F('h_uo', '尿量', 'mL/時', { min: 0, max: 2000 })}${F('h_lac', '乳酸', 'mmol/L', { min: 0, max: 30 })}</div>`, { right: '<button class="btn sm" data-reset="hemo">クリア</button>' })}
  ${CARD('血行動態モニタリング', `<div class="grid">
    ${F('h_co', 'CO（心拍出量）', 'L/分', { min: 0.5, max: 20 })}${F('h_cvp', 'CVP', 'mmHg', { min: -5, max: 40 })}${F('h_pawp', 'PAWP', 'mmHg', { min: 0, max: 50 })}
    ${F('h_svv', 'SVV / PPV', '%', { min: 0, max: 50, help: 'svv' })}${F('h_scvo2', 'ScvO₂ / SvO₂', '%', { min: 10, max: 100 })}${F('h_hb', 'Hb', 'g/dL', { min: 2, max: 25 })}
    ${F('h_sao2', 'SaO₂', '%', { min: 30, max: 100 })}${F('h_pao2', 'PaO₂', 'mmHg', { min: 10, max: 700 })}</div>
    <div class="tiny" style="margin-top:8px">FloTrac/EV1000、PAカテーテル、心エコーの値を入力。未入力の項目は計算しません。</div>`, { tag: '任意' })}
  ${CARD('Nohria-Stevenson分類（身体所見）', `<div class="grid g2" style="gap:16px"><div><div class="muted" style="font-weight:700;margin-bottom:6px">うっ血所見（Wet）</div><div class="chks" style="grid-template-columns:1fr">${wet.map(x => CHK('h_' + x[0], x[1])).join('')}</div></div>
    <div><div class="muted" style="font-weight:700;margin-bottom:6px">低灌流所見（Cold）</div><div class="chks" style="grid-template-columns:1fr">${cold.map(x => CHK('h_' + x[0], x[1])).join('')}</div></div></div>`, { right: help('nohria') })}
  </div><div class="sticky" id="h_out"></div></div>`;
}, computeHemo);

function nsGrid(p) {
  const cell = (k, t, s) => `<div style="border:2px solid ${p === k ? 'var(--brand)' : 'var(--line)'};background:${p === k ? 'var(--brand-soft)' : 'var(--panel2)'};border-radius:9px;padding:8px;text-align:center"><div style="font-weight:800;font-size:18px;color:${p === k ? 'var(--brand)' : 'var(--ink3)'}">${k}</div><div style="font-size:12px;font-weight:700">${t}</div><div class="tiny">${s}</div></div>`;
  return `<div style="display:grid;grid-template-columns:24px 1fr 1fr;gap:6px;align-items:center">
   <div></div><div class="tiny" style="text-align:center;font-weight:700">うっ血なし（Dry）</div><div class="tiny" style="text-align:center;font-weight:700">うっ血あり（Wet）</div>
   <div class="tiny" style="writing-mode:vertical-rl;font-weight:700">灌流良好</div>${cell('A', 'Warm & Dry', '')}${cell('B', 'Warm & Wet', '')}
   <div class="tiny" style="writing-mode:vertical-rl;font-weight:700">低灌流</div>${cell('L', 'Cold & Dry', '')}${cell('C', 'Cold & Wet', '')}</div>`;
}

function computeHemo() {
  validate($('#p-hemo'));
  const p = { hr: val('h_hr'), sbp: val('h_sbp'), dbp: val('h_dbp'), map: val('h_map'), ht: val('h_ht'), wt: val('h_wt'), co: val('h_co'), cvp: val('h_cvp'), pawp: val('h_pawp'), hb: val('h_hb'), sao2: val('h_sao2'), pao2: val('h_pao2'), uo: val('h_uo') };
  const o = L.hemo(p);
  // 比例脈圧の自動チェック表示
  const pa = $('#ppp_auto');
  if (pa) pa.textContent = L.isN(o.ppp) ? `　計算値 ${o.ppp.toFixed(0)}%${o.ppp < 25 ? '（該当）' : ''}` : '';
  if (!$('#h_c1').dataset.touched) $('#h_c1').checked = L.isN(o.ppp) && o.ppp < 25;
  $$('#p-hemo .chk').forEach(c => c.classList.toggle('on', $('input', c).checked));
  const wet = ['w1', 'w2', 'w3', 'w4', 'w5'].filter(k => chk('h_' + k)).length;
  const cold = ['c1', 'c2', 'c3', 'c4', 'c5'].filter(k => chk('h_' + k)).length;
  const ns = L.nohria(wet, cold);
  const lac = val('h_lac'), svv = val('h_svv'), scv = val('h_scvo2');
  const alerts = [];
  if (L.isN(o.map) && o.map < 65) alerts.push(['danger', `MAP ${o.map.toFixed(0)} mmHg：65 mmHg未満（臓器灌流圧の低下）`]);
  if (L.isN(o.si) && o.si >= 1) alerts.push([o.si >= 1.5 ? 'danger' : 'warn', `ショックインデックス ${o.si.toFixed(2)}：${o.si >= 1.5 ? '1.5以上（大量出血の目安）' : '1.0以上（ショックの可能性）'}`]);
  if (L.isN(lac) && lac > 2) alerts.push([lac >= 4 ? 'danger' : 'warn', `乳酸 ${lac} mmol/L：組織低灌流を示唆`]);
  if (L.isN(o.cpo) && o.cpo < 0.6) alerts.push(['danger', `CPO ${o.cpo.toFixed(2)} W：0.6 W未満（心原性ショックの予後不良因子）`]);
  if (L.isN(o.uokg) && o.uokg < 0.5) alerts.push(['warn', `尿量 ${o.uokg.toFixed(2)} mL/kg/時：0.5未満（乏尿）`]);
  if (L.isN(scv) && scv < 70) alerts.push(['warn', `ScvO₂ ${scv}%：70%未満（酸素需給バランスの悪化）`]);
  if (L.isN(svv) && svv >= 13) alerts.push(['info', `SVV/PPV ${svv}%：輸液反応性ありを示唆（調節換気・洞調律などの前提条件を確認）`]);
  const nsLv = { A: 'ok', B: 'warn', C: 'danger', L: 'warn' }[ns.p];
  let shock = '';
  if (o.shockType) shock = `<div class="alert ${o.shockType.k === 'distributive' || o.shockType.k === 'hypovolemic' ? 'warn' : 'danger'}"><div><b>ショックの型（血行動態パターン）</b><br>${esc(o.shockType.t)}</div></div>`;
  const out = CARD('Nohria-Stevenson分類', `<div class="hero ${nsLv}" style="margin-bottom:10px"><div class="lbl">プロファイル</div><div class="val" style="font-size:22px">${ns.t}</div><div class="desc">${ns.d}　うっ血 ${wet}項目／低灌流 ${cold}項目</div></div>${nsGrid(ns.p)}`, { right: help('nohria') }) +
    CARD('計算結果', `${alerts.map(a => `<div class="alert ${a[0]}">${a[1]}</div>`).join('')}${shock}<div class="kpis">
      ${KPI('MAP', fx(o.map), 'mmHg', lvRange(o.map, 65, 110, 60), o.map != null ? (o.mapCalculated ? '計算値' : '実測') : '')}
      ${KPI('ショックインデックス', fx(o.si, 2), '', L.isN(o.si) ? (o.si >= 1.5 ? 'danger' : o.si >= 1 ? 'warn' : 'ok') : '', '基準 0.5〜0.7', 'si')}
      ${KPI('脈圧', fx(o.pp), 'mmHg', '', L.isN(o.ppp) ? '比例脈圧 ' + o.ppp.toFixed(0) + '%' : '', 'ppp')}
      ${KPI('体表面積', fx(o.bsa, 2), 'm²', '', 'DuBois式')}
      ${KPI('CI', fx(o.ci, 2), 'L/分/m²', lvRange(o.ci, 2.5, 4.0, 2.2), '基準 2.5〜4.0', 'ci')}
      ${KPI('SV / SVI', L.isN(o.sv) ? o.sv.toFixed(0) + (L.isN(o.svi) ? ' / ' + o.svi.toFixed(0) : '') : '—', 'mL', lvRange(o.svi, 33, 47), '基準 SV 60〜100／SVI 33〜47')}
      ${KPI('SVR', fx(o.svr), '', lvRange(o.svr, 800, 1200), L.isN(o.svri) ? 'SVRI ' + o.svri.toFixed(0) : '基準 800〜1200', 'svr')}
      ${KPI('CPO', fx(o.cpo, 2), 'W', L.isN(o.cpo) ? (o.cpo < 0.6 ? 'danger' : 'ok') : '', '<0.6で予後不良', 'cpo')}
      ${KPI('DO₂ / DO₂I', L.isN(o.do2) ? o.do2.toFixed(0) + (L.isN(o.do2i) ? ' / ' + o.do2i.toFixed(0) : '') : '—', 'mL/分', lvRange(o.do2i, 500, 650, 400), 'DO₂I基準 500〜600', 'do2')}
      ${KPI('尿量', fx(o.uokg, 2), 'mL/kg/時', L.isN(o.uokg) ? (o.uokg < 0.5 ? 'warn' : 'ok') : '', '≧0.5を目標')}
      ${KPI('Forrester', o.forrester || '—', '', o.forrester ? ({ I: 'ok', II: 'warn', III: 'warn', IV: 'danger' })[o.forrester] : '', 'CI・PAWPが必要', 'forrester')}
      ${KPI('CS（心不全時）', o.cs ? 'CS' + o.cs : '—', '', o.cs === 3 ? 'warn' : 'info', 'SBPによる分類', 'cs')}
    </div>`) +
    CARD('解釈のポイント', `<ul class="ref" style="padding-left:18px;margin:0"><li>数値は単独で判断せず、意識・皮膚所見・尿量・乳酸・エコー所見と統合する。</li><li>ショックの型：循環血液量減少性（CO↓SVR↑CVP↓）／心原性（CO↓SVR↑PAWP↑）／閉塞性（CO↓CVP↑、エコーで鑑別）／血液分布異常性（CO→↑SVR↓）。</li><li>敗血症性ショックの初期目標：MAP≧65 mmHg（日本版敗血症診療ガイドライン2024）。</li></ul>`);
  $('#h_out').innerHTML = out;
}

Object.assign(HELP, {

page('nihss', 'NIHSS・神経評価', 'NIHSS採点と責任病変（大脳半球・血管領域）の検討、GCS/JCS', 'nihss', function () {

      ${it.note ? `<div class="tiny" style="margin-top:4px">${it.note}</div>` : ''}
      ${it.side ? `<div class="sidebox" id="sb_${it.k}"><div class="q">▶ ${it.side.q}</div>${SEG(it.side.name, it.side.opts, 'side')}</div>` : ''}</div></div>`;

  const gcsE = [[4, '4 自発的に開眼'], [3, '3 呼びかけで開眼'], [2, '2 痛み刺激で開眼'], [1, '1 開眼しない']];
  const gcsV = [[5, '5 見当識あり'], [4, '4 混乱した会話'], [3, '3 不適当な発語'], [2, '2 理解不能の音声'], [1, '1 発語なし'], ['T', 'T 挿管中']];
  const gcsM = [[6, '6 命令に従う'], [5, '5 疼痛部位を認識'], [4, '4 逃避屈曲'], [3, '3 異常屈曲（除皮質）'], [2, '2 伸展（除脳）'], [1, '1 動かない']];
  const jcs = [['0', '0 清明'], ['1', 'Ⅰ-1 だいたい清明だが今ひとつ'], ['2', 'Ⅰ-2 見当識障害'], ['3', 'Ⅰ-3 名前・生年月日が言えない'], ['10', 'Ⅱ-10 普通の呼びかけで開眼'], ['20', 'Ⅱ-20 大声・揺さぶりで開眼'], ['30', 'Ⅱ-30 痛み刺激でかろうじて開眼'], ['100', 'Ⅲ-100 払いのける'], ['200', 'Ⅲ-200 手足を動かす・顔をしかめる'], ['300', 'Ⅲ-300 全く反応しない']];
  return `<div class="tabs" data-tabs="nt"><button class="on" data-tab="nt-n">NIHSS</button><button data-tab="nt-g">GCS / JCS</button></div>

function brainSVG(r) {
  // 放射線学的表示（CTと同じ）：向かって左＝患者の右
  const hi = 'var(--danger)', soft = 'color-mix(in srgb,var(--danger) 22%,transparent)';
  const X = (hemi, x) => hemi === 'R' ? x : 220 - x; // 患者右を画像左側に
  const isH = r.hemi === 'R' || r.hemi === 'L';
  const terr = (r.territories || []).map(t => t.t).join(' ');
  const has = k => terr.indexOf(k) >= 0;
  const shapes = [];
  const hemiPath = h => h === 'R' ? 'M108 16 C58 16 22 52 22 104 C22 156 58 192 108 194 Z' : 'M112 16 C162 16 198 52 198 104 C198 156 162 192 112 194 Z';
  ['R', 'L'].forEach(h => shapes.push(`<path d="${hemiPath(h)}" fill="${isH && r.hemi === h ? soft : 'var(--panel2)'}" stroke="var(--ink2)" stroke-width="1.5"/>`));
  if (isH) {
    const h = r.hemi;
    shapes.push(`<clipPath id="cl${h}"><path d="${hemiPath(h)}"/></clipPath>`);
    const g = [];
    if (has('MCA')) g.push(`<ellipse cx="${X(h, 46)}" cy="104" rx="34" ry="62" fill="${hi}" opacity=".55"/>`);
    if (has('ACA')) g.push(`<rect x="${h === 'R' ? 86 : 112}" y="16" width="22" height="110" fill="${hi}" opacity=".55"/>`);
    if (has('PCA')) g.push(`<ellipse cx="${X(h, 82)}" cy="182" rx="34" ry="26" fill="${hi}" opacity=".55"/>`);
    if (has('内包') || has('視床') || has('ラクナ') || has('放線冠')) g.push(`<ellipse cx="${X(h, 90)}" cy="108" rx="10" ry="20" fill="${hi}" opacity=".85"/>`);
    shapes.push(`<g clip-path="url(#cl${h})">${g.join('')}</g>`);
  }
  // 後頭蓋窩
  const bs = r.hemi === 'BS', cb = r.hemi === 'CB';
  shapes.push(`<ellipse cx="82" cy="232" rx="22" ry="15" fill="${cb ? soft : 'var(--panel2)'}" stroke="var(--ink2)"/><ellipse cx="138" cy="232" rx="22" ry="15" fill="${cb ? soft : 'var(--panel2)'}" stroke="var(--ink2)"/><ellipse cx="110" cy="230" rx="12" ry="18" fill="${bs ? hi : 'var(--panel)'}" opacity="${bs ? .7 : 1}" stroke="var(--ink2)"/>`);
  shapes.push(`<text x="110" y="10" font-size="9" text-anchor="middle" fill="var(--ink3)">前（顔側）</text><text x="12" y="108" font-size="13" font-weight="800" fill="#1d4ed8">R</text><text x="200" y="108" font-size="13" font-weight="800" fill="#c2410c">L</text><text x="110" y="258" font-size="9" text-anchor="middle" fill="var(--ink3)">脳幹・小脳</text>`);
  return `<svg viewBox="0 0 220 262" width="170" role="img" aria-label="病変推定部位">${shapes.join('')}</svg>`;
}

function computeNIHSS() {
  // サイドボックス表示制御
  NI.forEach(it => {
    if (!it.side) return;
    const on = L.isN(ST[it.k]) && ST[it.k] > 0;
    const b = $('#sb_' + it.k); if (b) b.classList.toggle('on', on);
    if (!on && ST[it.side.name] !== undefined) { delete ST[it.side.name]; $$(`[data-seg="${it.side.name}"]`).forEach(x => x.classList.remove('on')); }
  });
  const s = {}; L.nihssItems.forEach(k => { s[k] = ST[k] === 'UN' ? 'UN' : (ST[k] === undefined ? undefined : +ST[k]); });
  ['gazeDir', 'visualSide', 'faceSide', 'ataxiaSide', 'sensorySide', 'neglectSide'].forEach(k => s[k] = ST[k] || '');
  s.dominant = ST.n_dom || 'L';
  const tot = L.nihssTotal(s);
  const sev = L.nihssSeverity(tot.total);
  const r = L.nihssLocalize(s);
  const done = 15 - tot.missing.length;
  const lmot = (L.isN(s.n5L) ? s.n5L : 0) + (L.isN(s.n6L) ? s.n6L : 0), rmot = (L.isN(s.n5R) ? s.n5R : 0) + (L.isN(s.n6R) ? s.n6R : 0);
  const hero = `<div class="hero ${tot.missing.length === 15 ? '' : sev.lv}"><div class="lbl">NIHSS 合計　<span class="tiny">入力 ${done}/15 項目</span></div><div class="val">${tot.total}<span style="font-size:16px"> / 42</span></div><div class="desc">${sev.t}${tot.missing.length && tot.missing.length < 15 ? '　<span class="pill warn">未入力あり</span>' : ''}</div></div>
   <div class="kpis" style="margin-bottom:10px">${KPI('<span class="sidechip R">右</span> 上下肢', rmot, '点', rmot ? 'warn' : 'ok', '5b+6b')}${KPI('<span class="sidechip L">左</span> 上下肢', lmot, '点', lmot ? 'warn' : 'ok', '5a+6a')}</div>`;
  const hemiLv = r.hemi ? (r.hemi === 'B' ? 'warn' : 'danger') : '';
  const loc = `<div class="brainwrap">${brainSVG(r)}<div style="flex:1"><div class="hero ${hemiLv}" style="margin:0 0 8px;padding:10px 12px"><div class="lbl">推定される責任病変</div><div class="val" style="font-size:17px">${esc(r.label)}</div></div>
      ${r.territories.map(t => `<div class="reason"><span class="s ${r.hemi}">領域</span><div><b>${esc(t.t)}</b><div class="tiny">${esc(t.d)}</div></div></div>`).join('')}
      <div class="tiny">図はCTと同じ向き（向かって左＝患者の右）</div></div></div>
    ${r.lvo ? `<div class="alert danger"><div><b>主幹動脈閉塞（LVO）を疑う所見</b>：皮質徴候を伴う重度の神経症状。発症時刻・最終健常確認時刻を確認し、脳卒中チームへ迅速に連絡。血管評価（CTA/MRA）を。</div></div>` : ''}
    ${r.warnings.map(w => `<div class="alert warn">${esc(w)}</div>`).join('')}
    ${r.reasons.length ? `<div style="margin-top:8px"><div class="muted" style="font-weight:700;margin-bottom:4px">判定の根拠</div>${r.reasons.map(x => `<div class="reason"><span class="s ${x.hemi}">${x.hemi === 'R' ? '右半球' : x.hemi === 'L' ? '左半球' : x.hemi === 'BS' ? '脳幹' : x.hemi === 'CB' ? '小脳' : x.hemi === 'B' ? '両側' : '参考'}</span><span>${esc(x.t)}</span></div>`).join('')}</div>` : ''}`;
  $('#n_out').innerHTML = CARD('NIHSS 結果', hero) + CARD('責任病変の検討', loc, { right: help('loc') }) +
    CARD('次のアクション（参考）', `<ul class="ref" style="padding-left:18px;margin:0"><li>最終健常確認時刻（LKW）の確認、血糖測定（低血糖の除外）</li><li>rt-PA静注療法：発症4.5時間以内が原則（静注血栓溶解療法適正治療指針 第三版）</li><li>機械的血栓回収療法：内頸動脈/M1閉塞、NIHSS≧6、ASPECTS≧6、発症6時間以内などで推奨（脳卒中治療ガイドライン2021［改訂2023］）。適応判断は医師が画像で行う。</li></ul>`);
  // GCS
  const e = ST.gE, v = ST.gV, m = ST.gM;
  const vt = v === 'T';
  const g = L.isN(+e) && L.isN(+m) && v !== undefined ? (vt ? (+e) + (+m) : (+e) + (+v) + (+m)) : null;
  const jv = ST.jcs;
  $('#g2_out').innerHTML = CARD('意識レベル', `<div class="kpis">${KPI('GCS', g == null ? '—' : vt ? g + 'T' : g, '', g == null ? '' : vt ? 'info' : g <= 8 ? 'danger' : g <= 13 ? 'warn' : 'ok', g == null ? 'E・V・Mを選択' : `E${e}V${v}M${m}`, 'gcs')}${KPI('JCS', jv == null ? '—' : jv, '', jv == null ? '' : +jv >= 100 ? 'danger' : +jv >= 10 ? 'warn' : +jv > 0 ? 'info' : 'ok', '', 'jcs')}</div>${g != null && !vt && g <= 8 ? '<div class="alert danger">GCS 8以下：気道確保・呼吸管理を考慮</div>' : ''}`);
}

      ${SEL('u_fpk', '維持水分量', [['25', '25 mL/kg'], ['30', '30 mL/kg'], ['35', '35 mL/kg'], ['40', '40 mL/kg']], { v: '30' })}</div>`)}
  ${CARD('目標を何割に設定するか', `<div class="range"><input type="range" id="u_pct" min="5" max="120" step="1" value="70"><div class="rv"><span id="u_pctv">70</span>%</div></div>

    <div class="tiny" style="margin-top:8px">急性期早期は目標の70%以下から開始し、第4病日以降に耐容性を見て80〜100%へ漸増（ESPEN 2019・日本版重症患者の栄養療法GL 2016）。</div>

function computeNutri() {
  validate($('#p-nutri'));
  $('#u_meth_simple').style.display = ST.u_meth === 'hb' ? 'none' : '';
  $('#u_meth_hb').style.display = ST.u_meth === 'hb' ? '' : 'none';
  $('#u_pctv').textContent = $('#u_pct').value;
  $$('#p-nutri .chk').forEach(c => c.classList.toggle('on', $('input', c).checked));
  const p = { sex: $('#u_sex').value, age: val('u_age'), ht: val('u_ht'), wt: val('u_wt'), basis: $('#u_basis').value, method: ST.u_meth, kcalPerKg: +$('#u_kpk').value, af: +$('#u_af').value, sf: +$('#u_sf').value, targetPct: +$('#u_pct').value, proteinPerKg: +$('#u_ppk').value, fluidPerKg: +$('#u_fpk').value, proteinFollowPct: chk('u_ppct') };
  const o = L.nutri(p);
  // 投与量
  const enC = val('u_en_c'), enR = val('u_en_r'), enH = val('u_en_h');
  const enVol = L.isN(enR) && L.isN(enH) ? enR * enH : 0;
  const enK = L.isN(enC) ? enVol * enC : 0;
  const enP = enK * (val('u_en_p') || 0) / 100;
  const enW = enVol * (val('u_en_w') || 0) / 100;
  const gluG = (val('u_glu_c') || 0) / 100 * (val('u_glu_v') || 0);
  const proK = (val('u_pro') || 0) * 24 * 1.1;
  const items = [
    { name: '経腸栄養', kcal: enK, protein: enP, water: enW },
    { name: 'PN', kcal: val('u_pn_k') || 0, protein: val('u_pn_p') || 0 },
    { name: 'ブドウ糖', kcal: gluG * 4, glucoseG: gluG },
    { name: 'プロポフォール', kcal: proK },
    { name: '経口', kcal: val('u_or_k') || 0, protein: val('u_or_p') || 0 }
  ];
  const it = L.intake(items);
  // 水分出納
  const ins = L.insensible(p.wt, val('u_temp'));
  const inSum = (val('u_in_iv') || 0) + (val('u_in_or') || 0) + (val('u_in_fl') || 0) + enW + (ins ? ins.metabolic : 0);
  const outSum = (val('u_out_u') || 0) + (val('u_out_d') || 0) + (val('u_out_s') || 0) + (val('u_out_o') || 0) + (ins ? ins.insensible : 0);
  const anyIO = ['u_in_iv', 'u_in_or', 'u_in_fl', 'u_out_u', 'u_out_d', 'u_out_s', 'u_out_o'].some(k => val(k) != null) || enW > 0;
  // Refeeding
  const bmi = o.bmi;
  const rf = L.refeeding({ bmi16: chk('rf_bmi16') || (L.isN(bmi) && bmi < 16), loss15: chk('rf_l15'), noIntake10: chk('rf_n10'), lowElectrolytes: chk('rf_el'), bmi185: chk('rf_bmi185') || (L.isN(bmi) && bmi < 18.5), loss10: chk('rf_l10'), noIntake5: chk('rf_n5'), alcoholDrugs: chk('rf_alc'), bmi14: chk('rf_bmi14') || (L.isN(bmi) && bmi < 14), noIntake15: chk('rf_n15') });
  $('#rf_out').innerHTML = rf.high ? `<div class="alert danger"><div><b>Refeeding症候群 ${rf.extreme ? '超高' : '高'}リスク</b>：${rf.extreme ? '5' : '10'} kcal/kg/日から開始し、4〜7日かけて漸増。開始前から P・K・Mg を補正・モニタリングし、ビタミンB₁を投与（NICE CG32）。${L.isN(bmi) && bmi < 18.5 ? '<br><span class="tiny">BMIから自動判定した項目を含みます</span>' : ''}</div></div>` : `<div class="alert ok">現時点の入力ではRefeeding高リスク基準に該当しません。</div>`;
  // ramp
  if (L.isN(o.fullKcal)) {
    const rows = L.ramp(o.fullKcal, val('u_rs') || 50, val('u_re') || 100, val('u_rd') || 5);
    $('#u_ramp').innerHTML = `<div class="tw"><table class="t"><thead><tr><th>日</th>${rows.map(r => `<th>${r.day}日目</th>`).join('')}</tr></thead><tbody><tr><td>割合</td>${rows.map(r => `<td>${r.pct.toFixed(0)}%</td>`).join('')}</tr><tr><td>kcal</td>${rows.map(r => `<td>${r.kcal.toFixed(0)}</td>`).join('')}</tr>${enC ? `<tr><td>EN速度<span class="tiny">(24h)</span></td>${rows.map(r => `<td>${(r.kcal / enC / 24).toFixed(0)}<span class="tiny">mL/h</span></td>`).join('')}</tr>` : ''}</tbody></table></div>`;
  } else $('#u_ramp').innerHTML = '<div class="muted">身長・体重を入力すると表示します</div>';

  if (!L.isN(o.bmi)) { $('#u_out').innerHTML = CARD('結果', '<div class="hero"><div class="val" style="font-size:20px;color:var(--ink3)">身長・体重を入力</div></div>'); return; }
  if (!L.isN(o.fullKcal)) { $('#u_out').innerHTML = CARD('結果', '<div class="hero"><div class="val" style="font-size:20px;color:var(--ink3)">年齢を入力してください</div><div class="desc">Harris-Benedict式には年齢が必要です。</div></div>'); return; }
  const bmiLv = o.bmi < 18.5 ? 'warn' : o.bmi >= 30 ? 'warn' : o.bmi >= 25 ? 'info' : 'ok';
  const basisJ = { actual: '実測体重', ideal: '標準体重', adjusted: '調整体重' }[o.basisUsed];
  const kPct = o.targetKcal ? it.kcal / o.targetKcal * 100 : null, kFull = o.fullKcal ? it.kcal / o.fullKcal * 100 : null;
  const pPct = o.targetProtein ? it.protein / o.targetProtein * 100 : null;
  const bar = (pct, mark) => `<div class="bar ${pct > 110 ? 'over' : ''}"><i style="width:${Math.min(100, pct || 0)}%"></i>${mark ? `<span class="mk" style="left:${Math.min(100, mark)}%"></span>` : ''}</div>`;
  const kcalPerKgNow = o.targetKcal / o.dw;
  const out = `<div class="hero info"><div class="lbl">目標エネルギー（全量の${o.targetPct}%）</div><div class="val">${o.targetKcal.toFixed(0)}<span style="font-size:16px"> kcal/日</span></div><div class="desc">全量 ${o.fullKcal.toFixed(0)} kcal（${(o.fullKcal / o.dw).toFixed(1)} kcal/kg）→ 目標 ${kcalPerKgNow.toFixed(1)} kcal/kg・${basisJ} ${o.dw.toFixed(1)} kg で計算</div></div>
   <div class="kpis">${KPI('BMI', o.bmi.toFixed(1), '', bmiLv, o.bmi < 18.5 ? '低体重' : o.bmi >= 25 ? '肥満' : '普通体重')}${KPI('標準体重', o.ibw.toFixed(1), 'kg', '', 'BMI22')}${KPI('調整体重', o.adjbw.toFixed(1), 'kg', '', '')}${o.bee ? KPI('BEE', o.bee.toFixed(0), 'kcal', '', 'H-B式') : ''}
   ${KPI('たんぱく質', o.targetProtein.toFixed(0), 'g/日', 'info', p.proteinPerKg + ' g/kg' + (p.proteinFollowPct ? '×' + o.targetPct + '%' : ''))}${KPI('維持水分量', o.fluid.toFixed(0), 'mL/日', 'info', p.fluidPerKg + ' mL/kg')}${KPI('Holliday-Segar', o.holliday.toFixed(0), 'mL/日', '', '4-2-1則（参考）')}</div>`;
  const hasIntake = it.kcal > 0 || it.protein > 0;
  const ach = hasIntake ? `<div style="display:grid;gap:12px">
     <div><div class="row"><b>エネルギー</b><span class="sp"></span><span class="num">${it.kcal.toFixed(0)} / ${o.targetKcal.toFixed(0)} kcal</span><span class="pill ${kPct < 80 ? 'warn' : kPct > 110 ? 'danger' : 'ok'}">${kPct.toFixed(0)}%</span></div>${bar(kPct)}<div class="tiny">全量に対しては ${kFull.toFixed(0)}%</div></div>
     <div><div class="row"><b>たんぱく質</b><span class="sp"></span><span class="num">${it.protein.toFixed(1)} / ${o.targetProtein.toFixed(0)} g</span><span class="pill ${pPct < 80 ? 'warn' : 'ok'}">${pPct.toFixed(0)}%</span></div>${bar(pPct)}<div class="tiny">${(it.protein / o.dw).toFixed(2)} g/kg/日</div></div>
     <table class="t"><tbody>${items.filter(x => x.kcal > 0 || x.protein > 0).map(x => `<tr><td>${x.name}</td><td>${x.kcal.toFixed(0)} kcal</td><td>${(x.protein || 0).toFixed(1)} g</td></tr>`).join('')}</tbody></table>
     ${it.npcn ? `<div class="tiny">NPC/N比 ${it.npcn.toFixed(0)} ${help('npc')}</div>` : ''}
     ${gluG > 0 && L.isN(o.dw) ? `<div class="tiny">ブドウ糖投与速度 ${(gluG * 1000 / o.dw / 1440).toFixed(2)} mg/kg/分（目安 ≦4〜5）</div>` : ''}
     ${kPct > 110 ? '<div class="alert warn">設定した目標を超えています。急性期の過剰投与（overfeeding）に注意。</div>' : ''}${proK > 0 ? `<div class="alert info">プロポフォール由来 ${proK.toFixed(0)} kcal/日（脂質）を含みます。</div>` : ''}</div>` : '<div class="muted">「現在の投与量」を入力すると達成率を表示します。</div>';
  const io = anyIO ? `<div class="kpis">${KPI('IN', inSum.toFixed(0), 'mL', '', '代謝水 ' + (ins ? ins.metabolic.toFixed(0) : 0) + ' mL含む')}${KPI('OUT', outSum.toFixed(0), 'mL', '', '不感蒸泄 ' + (ins ? ins.insensible.toFixed(0) : 0) + ' mL含む')}${KPI('バランス', (inSum - outSum > 0 ? '+' : '') + (inSum - outSum).toFixed(0), 'mL', Math.abs(inSum - outSum) > 1000 ? 'warn' : 'ok')}</div>${ins && ins.feverAdd > 0 ? `<div class="tiny" style="margin-top:6px">発熱による不感蒸泄の増加 +${ins.feverAdd.toFixed(0)} mL</div>` : ''}` : '<div class="muted">IN/OUTを入力するとバランスを計算します。</div>';
  $('#u_out').innerHTML = CARD('必要量', out) + CARD('目標達成率', ach) + CARD('水分出納（24時間）', io, { right: help('insens') });
}

Object.assign(HELP, {

  qsofa: { t: 'qSOFA', b: '<p>呼吸数≧22回/分、意識変容（GCS<15）、収縮期血圧≦100 mmHg の3項目。2項目以上で敗血症を疑い、臓器障害の評価（SOFA）を行う。感度が低いため単独のスクリーニングには用いない（SSCG 2021はqSOFA単独でのスクリーニングを推奨していない）。</p>' },
  sirs: { t: 'SIRS', b: '<p>体温>38℃または<36℃、心拍数>90回/分、呼吸数>20回/分またはPaCO₂<32 mmHg、白血球>12,000/μLまたは<4,000/μLまたは未熟顆粒球>10%。2項目以上でSIRS。現在の敗血症定義には用いないが、感染症の拾い上げに有用。</p>' },
  shock: { t: '敗血症性ショック', b: '<p>敗血症のうち、<b>十分な輸液負荷にもかかわらず平均血圧65 mmHg以上を維持するために血管収縮薬を必要とし、かつ血清乳酸値が2 mmol/L（18 mg/dL）を超える</b>もの（Sepsis-3、J-SSCG 2024）。</p>' },

});

page('sepsis', 'SOFA・敗血症評価', 'SOFA・qSOFA・SIRS・敗血症/敗血症性ショックの判定、昇圧薬γ計算', 'sepsis', function () {
  return `<div class="cols"><div>
  ${CARD('SOFA（6臓器）', `<div class="muted" style="font-weight:700">呼吸</div><div class="grid">${F('s_po2', 'PaO₂', 'mmHg', { min: 10, max: 700 })}${F('s_fio2', 'FiO₂', '%', { min: 21, max: 100 })}${F('s_pf', 'P/F比（直接入力）', '', { min: 10, max: 700, hint: 'PaO₂・FiO₂から自動計算も可' })}</div>${CHK('s_resp', '人工呼吸（侵襲的・非侵襲的）による呼吸補助あり')}

      ${F('s_bil', '総ビリルビン', 'mg/dL', { min: 0, max: 50 })}${F('s_gcs', 'GCS', '点', { min: 3, max: 15, hint: '鎮静前の値で評価' })}${F('s_cr', 'クレアチニン', 'mg/dL', { min: 0.1, max: 20 })}${F('s_uo', '尿量', 'mL/日', { min: 0, max: 10000 })}</div>
    <hr class="s"><div class="muted" style="font-weight:700">循環</div><div class="grid">${F('s_map', 'MAP', 'mmHg', { min: 20, max: 200 })}${F('s_doa', 'ドパミン', 'μg/kg/分', { min: 0, max: 30 })}${F('s_dob', 'ドブタミン', 'μg/kg/分', { min: 0, max: 30 })}${F('s_ne', 'ノルアドレナリン', 'μg/kg/分', { min: 0, max: 5 })}${F('s_epi', 'アドレナリン', 'μg/kg/分', { min: 0, max: 5 })}</div><div class="tiny">カテコラミンは1時間以上投与しているもの</div>
    <hr class="s"><div class="grid g2">${F('s_base', 'ベースラインSOFA', '点', { v: 0, min: 0, max: 24, hint: '既知の臓器障害がなければ0' })}<div style="align-self:end">${CHK('s_inf', '感染症が疑われる（確定または疑い）')}</div></div>`, { right: help('sofa') + ' <button class="btn sm" data-reset="sepsis">クリア</button>' })}
  ${CARD('qSOFA・SIRS', `<div class="grid">${F('s_rr', '呼吸数', '回/分', { min: 0, max: 80 })}${F('s_sbp', '収縮期血圧', 'mmHg', { min: 20, max: 300 })}${F('s_hr', '心拍数', '回/分', { min: 20, max: 250 })}${F('s_temp', '体温', '℃', { min: 30, max: 43 })}${F('s_pco2', 'PaCO₂', 'mmHg', { min: 5, max: 150 })}${F('s_wbc', '白血球', '/μL', { min: 0, max: 200000, hint: '例 12000' })}</div>

  ${CARD('敗血症性ショックの判定', `<div class="chks" style="grid-template-columns:1fr">${CHK('s_fluid', '十分な輸液負荷を行った')}${CHK('s_vaso', 'MAP≧65 mmHgの維持に血管収縮薬が必要')}</div><div class="grid" style="margin-top:10px">${F('s_lac', '乳酸', 'mmol/L', { min: 0, max: 30, hint: 'mg/dL ÷ 9 ≒ mmol/L' })}</div>`, { right: help('shock') })}
  ${CARD('昇圧薬・強心薬 γ計算', `<div class="grid">${SEL('d_drug', '薬剤', [['ne', 'ノルアドレナリン'], ['epi', 'アドレナリン'], ['doa', 'ドパミン'], ['dob', 'ドブタミン']], { v: 'ne' })}${F('d_mg', '薬剤量', 'mg', { min: 0, max: 1000 })}${F('d_ml', '総量', 'mL', { min: 1, max: 1000 })}${F('d_wt', '体重', 'kg', { min: 1, max: 300 })}${F('d_rate', '流量', 'mL/時', { min: 0, max: 200 })}${F('d_target', '目標γ（逆算）', 'μg/kg/分', { min: 0, max: 30 })}</div><div id="d_out" style="margin-top:10px"></div>`, { right: help('dose') })}
  </div><div class="sticky" id="s_out"></div></div>`;

function computeSepsis() {
  validate($('#p-sepsis'));
  $$('#p-sepsis .chk').forEach(c => c.classList.toggle('on', $('input', c).checked));
  const po2 = val('s_po2'), fi = val('s_fio2');
  let pf = val('s_pf'); if (pf == null && L.isN(po2) && L.isN(fi) && fi > 0) pf = po2 / (fi / 100);
  let plt = val('s_plt'); if (L.isN(plt)) plt = $('#s_pltu').value === '4' ? plt * 10 : plt;
  const gcs = val('s_gcs');
  const p = { pf, respSupport: chk('s_resp'), plt, bil: val('s_bil'), map: val('s_map'), doa: val('s_doa'), dob: val('s_dob'), ne: val('s_ne'), epi: val('s_epi'), gcs, cr: val('s_cr'), uo: val('s_uo') };
  const o = L.sofa(p);
  const base = val('s_base') || 0, delta = o.total - base;
  const inf = chk('s_inf');
  const ment = chk('s_ment') || (L.isN(gcs) && gcs < 15);
  const q = L.qsofa(val('s_rr'), val('s_sbp'), ment);
  const sr = L.sirs({ temp: val('s_temp'), hr: val('s_hr'), rr: val('s_rr'), pco2: val('s_pco2'), wbc: val('s_wbc'), bands: chk('s_band') });
  const lac = val('s_lac');
  const vasoOn = chk('s_vaso') || ((p.ne || 0) + (p.epi || 0) + (p.doa || 0) > 0);
  const sepsis = inf && delta >= 2;
  const shock = sepsis && vasoOn && L.isN(lac) && lac > 2 && chk('s_fluid');
  const nIn = 6 - o.missing.length;
  let hero;
  if (shock) hero = `<div class="hero danger"><div class="lbl">判定</div><div class="val">敗血症性ショック</div><div class="desc">感染症＋ΔSOFA ${delta}点、輸液後も血管収縮薬が必要、乳酸 ${lac} mmol/L &gt; 2</div></div>`;
  else if (sepsis) hero = `<div class="hero danger"><div class="lbl">判定</div><div class="val">敗血症</div><div class="desc">感染症の疑い＋SOFAがベースラインから ${delta} 点上昇（≧2）</div></div>`;
  else if (inf && nIn > 0) hero = `<div class="hero ${delta >= 1 ? 'warn' : 'ok'}"><div class="lbl">判定</div><div class="val" style="font-size:22px">現時点で敗血症の基準を満たさない</div><div class="desc">ΔSOFA ${delta}点（≧2で敗血症）。未入力の臓器：${o.missing.join('・') || 'なし'}</div></div>`;
  else hero = `<div class="hero"><div class="lbl">判定</div><div class="val" style="font-size:19px;color:var(--ink3)">${nIn ? '「感染症が疑われる」にチェックすると敗血症を判定' : 'SOFAの各項目を入力'}</div></div>`;
  const organs = [['resp', '呼吸'], ['coag', '凝固'], ['liver', '肝'], ['cv', '循環'], ['cns', '中枢神経'], ['renal', '腎']];
  const og = `<div style="display:grid;gap:7px">${organs.map(x => { const v = o.parts[x[0]]; const c = v == null ? 'var(--line2)' : v >= 3 ? 'var(--danger)' : v >= 2 ? 'var(--warn)' : v >= 1 ? 'var(--info)' : 'var(--ok)'; return `<div style="display:grid;grid-template-columns:70px 1fr 34px;gap:8px;align-items:center;font-size:13px"><b>${x[1]}</b><div style="display:flex;gap:3px">${[1, 2, 3, 4].map(i => `<span style="flex:1;height:12px;border-radius:3px;background:${v != null && v >= i ? c : 'var(--line)'}"></span>`).join('')}</div><span class="num" style="text-align:right;font-weight:800;color:${c}">${v == null ? '—' : v}</span></div>`; }).join('')}</div>`;
  const out = CARD('判定', hero + `<div class="kpis">${KPI('SOFA', nIn ? o.total : '—', '点', o.total >= 2 ? 'warn' : 'ok', `入力 ${nIn}/6 臓器`, 'sofa')}${KPI('ΔSOFA', nIn ? (delta >= 0 ? '+' : '') + delta : '—', '', delta >= 2 ? 'danger' : 'ok', 'ベースライン ' + base)}${KPI('qSOFA', q.score, '/3', q.score >= 2 ? 'danger' : q.score ? 'warn' : 'ok', q.items.join('・') || '該当なし', 'qsofa')}${KPI('SIRS', sr.score, '/4', sr.score >= 2 ? 'warn' : 'ok', sr.items.join('・') || '該当なし', 'sirs')}${KPI('P/F比', fx(pf), '', pf == null ? '' : pf < 200 ? 'danger' : pf < 300 ? 'warn' : 'ok', pf != null && val('s_pf') == null ? '自動計算' : '')}${KPI('乳酸', lac == null ? '—' : lac, 'mmol/L', lac == null ? '' : lac > 4 ? 'danger' : lac > 2 ? 'warn' : 'ok')}</div>
    ${q.score >= 2 && !sepsis ? '<div class="alert warn">qSOFA 2点以上：敗血症を疑い、SOFAによる臓器障害の評価・血液培養・乳酸測定を。</div>' : ''}
    ${pf != null && pf < 200 && !p.respSupport ? '<div class="alert info">P/F <200 でも呼吸補助がない場合、呼吸は2点で評価されます。</div>' : ''}`) +
    CARD('臓器別スコア', og) +
    CARD('初期対応のポイント（J-SSCG 2024 / SSCG 2021）', `<ul class="ref" style="padding-left:18px;margin:0"><li>敗血症を認識したら血液培養2セット採取後、可及的速やかに抗菌薬投与（ショックでは1時間以内を目標）</li><li>乳酸値の測定と再評価</li><li>低血圧・乳酸高値では晶質液による初期輸液（30 mL/kgが目安、反応を評価しながら）</li><li>MAP≧65 mmHgを目標に、第一選択の血管収縮薬はノルアドレナリン</li><li>感染巣の検索と早期のソースコントロール</li></ul>`);
  $('#s_out').innerHTML = out;
  // γ計算
  const g = L.dose(val('d_mg'), val('d_ml'), val('d_rate'), val('d_wt'));
  const rr = L.rateFromDose(val('d_mg'), val('d_ml'), val('d_target'), val('d_wt'));
  const conc = L.isN(val('d_mg')) && L.isN(val('d_ml')) && val('d_ml') > 0 ? val('d_mg') * 1000 / val('d_ml') : null;
  $('#d_out').innerHTML = `<div class="kpis">${KPI('濃度', fx(conc, 1), 'μg/mL')}${KPI('投与量', g == null ? '—' : g.toFixed(g < 1 ? 3 : 2), 'μg/kg/分', 'info')}${KPI('目標γの流量', fx(rr, 1), 'mL/時', '')}</div>${g != null ? `<button class="btn sm pri" id="d_apply" style="margin-top:8px">この投与量をSOFAの循環に反映</button>` : ''}`;
}

/* =========================================================
   6. 災害トリアージタグ練習（START法）
   ========================================================= */
const TR = { c: null, keep: 3, t0: 0, stats: { n: 0, ok: 0, time: 0, miss: {} }, judged: false, cat: null, hist: [] };
const COLORS = ['black', 'red', 'yellow', 'green'];
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[rnd(0, a.length - 1)];

function genCase() {
  const r = Math.random();
  const target = r < 0.22 ? 'green' : r < 0.47 ? 'yellow' : r < 0.86 ? 'red' : 'black';
  const who = pick(['20代', '30代', '40代', '50代', '60代', '70代', '80代']) + pick(['男性', '女性']);
  const c = { walk: false, breathing: true, airwayBreath: null, rr: rnd(14, 26), radial: true, crt: pick([1, 1.5, 2]), obeys: true, who, sub: '' };
  let story = '';
  if (target === 'green') {
    c.walk = true;
    story = pick(['前額部から出血しているが、自力で歩いて指定の集合場所まで来た。', '左前腕の変形を右手で押さえながら、歩いて救護所に来た。', '「胸が少し痛い」と訴えるが、自分で歩いて移動できる。', '顔面に多数の擦過傷があり泣いているが、呼びかけに応じて歩いて移動した。', '足を引きずりながらも、自力で歩いて安全な場所へ移動できた。']);
    if (Math.random() < 0.4) { c.rr = rnd(30, 34); c.sub = 'green-trap'; }
  } else if (target === 'yellow') {
    story = pick(['右大腿部に変形と腫脹があり、立ち上がれない。', '腰背部の痛みを強く訴え、歩くことができない。', '下腿の開放創から出血していたが圧迫で止血。痛みで歩行不能。', '両足関節が腫れて立てない。会話は明瞭。', '倒れた家具に足を挟まれていた。救出後も歩けない。']);
    c.rr = rnd(12, 28); c.crt = pick([1, 1.5, 2]);
  } else if (target === 'red') {
    const t = pick(['airway', 'rrHigh', 'rrLow', 'radial', 'crt', 'obeys']); c.sub = t;
    if (t === 'airway') { c.breathing = false; c.airwayBreath = true; story = '倒れて動かない。呼吸が確認できないため、用手的に気道確保を行った。'; }
    if (t === 'rrHigh') { c.rr = rnd(30, 44); story = pick(['胸部を強く打ち、苦しそうに浅く速い呼吸をしている。', '瓦礫の下から救出された。息苦しさを訴え座り込んでいる。']); }
    if (t === 'rrLow') { c.rr = rnd(5, 9); story = '仰向けに倒れている。ゆっくりとした呼吸をしている。'; }
    if (t === 'radial') { c.radial = false; c.crt = pick([3, 3.5, 4]); story = pick(['腹部に打撲痕があり、顔面蒼白で冷汗をかいている。', '骨盤部の痛みを訴え、皮膚が冷たく湿っている。']); }
    if (t === 'crt') { c.crt = pick([2.5, 3, 4]); story = '大腿部から出血が続いている。皮膚は蒼白。'; }
    if (t === 'obeys') { c.obeys = false; story = pick(['頭部に打撲痕がある。呼びかけに開眼するが、「手を握って」という指示に従えない。', '倒れていて、意味のない言葉を発している。簡単な指示に応じない。']); }
  } else {
    c.breathing = false; c.airwayBreath = false;
    story = pick(['瓦礫の下に横たわっている。呼吸が確認できないため、用手的に気道確保を行った。', '倒壊した家屋の前で倒れている。反応がなく、呼吸もない。気道確保を行った。']);
  }
  c.story = story;
  c.ans = L.start(c);
  return c;
}

function caseHTML(c) {
  const chips = [];
  chips.push(`<span>歩行：<b>${c.walk ? '可能' : '不可'}</b></span>`);
  if (!c.walk || c.sub === 'green-trap') {
    if (!c.breathing) chips.push(`<span>自発呼吸：<b>なし</b></span><span>気道確保後：<b>${c.airwayBreath ? '呼吸が出現した' : '呼吸は出現しない'}</b></span>`);
    else {
      chips.push(`<span>呼吸数：<b>${c.rr}</b> 回/分</span>`);
      if (!c.walk) chips.push(`<span>橈骨動脈：<b>${c.radial ? '触知可' : '触知不可'}</b></span><span>CRT：<b>${c.crt}</b> 秒</span><span>指示：<b>${c.obeys ? '従える' : '従えない'}</b></span>`);
    }
  }
  return `<div class="case"><div class="pill info" style="margin-bottom:6px">傷病者 No.${TR.stats.n + 1}　${c.who}</div><div>${esc(c.story)}</div><div class="vit">${chips.join('')}</div></div>`;
}

const TIP = {
  'green-trap': '歩行可能な傷病者は、呼吸数など他の所見にかかわらずSTART法ではまず「緑」。ただし二次トリアージ・継続観察で再評価する。',
  airway: '自発呼吸がない場合はまず気道確保。呼吸が出現すれば「赤」、出現しなければ「黒」。',
  rrHigh: '呼吸数30回/分以上は「赤」。',
  rrLow: '呼吸数10回/分未満は「赤」。',
  radial: '橈骨動脈が触知できない（またはCRT>2秒）は循環不全として「赤」。',
  crt: 'CRT（毛細血管再充満時間）が2秒を超えれば「赤」。',
  obeys: '簡単な指示に従えない意識障害は「赤」。'
};

page('triage', '災害トリアージ練習', 'START法による一次トリアージとトリアージタグの切り取り練習', 'triage', function () {

    <div class="fx"><div>No.</div><div><input id="tt_no"></div></div>

function trRenderTag() {
  $$('#ttag .strip').forEach(s => s.classList.toggle('torn', +s.dataset.strip > TR.keep));
  $$('#tt_cats span').forEach(s => s.classList.toggle('on', s.dataset.cat === TR.cat));
}
function trNext() {
  TR.c = genCase(); TR.keep = 3; TR.judged = false; TR.cat = null; TR.t0 = Date.now();
  ['tt_no', 'tt_name', 'tt_age', 'tt_time', 'tt_sym'].forEach(id => setv(id, ''));
  setv('tt_no', TR.stats.n + 1);
  $('#tr_case').innerHTML = caseHTML(TR.c); $('#tr_fb').innerHTML = ''; trRenderTag();
}
function trJudge() {
  if (!TR.c || TR.judged) return;
  const t = (Date.now() - TR.t0) / 1000;
  const chosen = COLORS[TR.keep], ans = TR.c.ans.color;
  let ok = chosen === ans;
  const fillErr = [];
  if (chk('tr_fill')) {
    if (!$('#tt_time').value.trim()) fillErr.push('実施日時');
    if (!$('#tt_who').value.trim()) fillErr.push('実施者');
    if (!$('#tt_where').value.trim()) fillErr.push('実施場所');
    if (TR.cat !== L.triageColors[chosen].cat) fillErr.push('区分の○（' + L.triageColors[chosen].cat + 'に○）');
  }
  TR.judged = true; TR.stats.n++; if (ok) TR.stats.ok++; TR.stats.time += t;
  TR.hist.unshift({ n: TR.stats.n, ans, chosen, ok, t });
  const C = L.triageColors;
  $('#tr_fb').innerHTML = CARD(ok ? '正解' : '不正解', `<div class="hero ${ok ? 'ok' : 'danger'}" style="margin-bottom:12px"><div class="lbl">あなたの判定 → 正答</div><div class="val" style="font-size:22px"><span class="colorchip ${chosen}">${C[chosen].j} ${C[chosen].cat}</span> → <span class="colorchip ${ans}">${C[ans].j} ${C[ans].cat}</span></div><div class="desc">${C[ans].name}　判定時間 ${t.toFixed(1)} 秒${t > 30 ? '（目標30秒以内）' : ''}</div></div>
    <div class="flow">${TR.c.ans.path.map((s, i, a) => `<div class="fs ${i === a.length - 1 ? 'end' : ''}"><span class="q">${s.q}</span><span class="a">${s.a}</span>${i === a.length - 1 ? `<span class="colorchip ${ans}">${C[ans].j}</span>` : ''}</div>`).join('')}</div>
    ${TIP[TR.c.sub] ? `<div class="alert info">${TIP[TR.c.sub]}</div>` : ''}
    ${fillErr.length ? `<div class="alert warn">タグ記入の不備：${fillErr.join('、')}</div>` : chk('tr_fill') ? '<div class="alert ok">タグ記入は適切です。</div>' : ''}`);
  $('#tr_ok').textContent = TR.stats.ok; $('#tr_n').textContent = TR.stats.n;
  $('#tr_rate').textContent = Math.round(TR.stats.ok / TR.stats.n * 100) + '%';
  $('#tr_avg').textContent = (TR.stats.time / TR.stats.n).toFixed(1);
  $('#tr_hist').innerHTML = CARD('履歴', `<div class="tw"><table class="t"><thead><tr><th>No.</th><th>正答</th><th>判定</th><th>時間</th><th></th></tr></thead><tbody>${TR.hist.slice(0, 15).map(h => `<tr><td>${h.n}</td><td><span class="colorchip ${h.ans}">${C[h.ans].j}</span></td><td><span class="colorchip ${h.chosen}">${C[h.chosen].j}</span></td><td>${h.t.toFixed(1)}秒</td><td>${h.ok ? '<span class="pill ok">○</span>' : '<span class="pill danger">×</span>'}</td></tr>`).join('')}</tbody></table></div>`);
}
